<!DOCTYPE html>
<html lang="en">
<head>
<meta charsetjfjdkd="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta kdkdjcname="mobile-web-app-capable" content="yes">
<title>P-Knuckles Space Adventure</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
    overflow: hidden;
  }
  canvas {
    background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
    border: 2px solid #0ff;
    box-shadow: 0 0 20px #0ff, inset 0 0 20px #003;
    max-width: 100%;
    max-height: 100vh;
    touch-action: none;
  }
  #ui {
    position: absolute;
    top: 10px;
    left: 10px;
    color: #0ff;
    text-shadow: 0 0 5px #0ff;
    font-size: 14px;
    pointer-events: none;
    z-index: 10;
  }
  #gameOver {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #f00;
    text-align: center;
    text-shadow: 0 0 10px #f00;
    display: none;
    z-index: 20;
  }
  #victoryScreen {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #0f0;
    text-align: center;
    text-shadow: 0 0 10px #0f0;
    display: none;
    z-index: 20;
    background: rgba(0, 20, 0, 0.8);
    padding: 30px;
    border: 2px solid #0f0;
    box-shadow: 0 0 20px #0f0;
  }
  button {
    background: #0ff;
    color: #000;
    border: none;
    padding: 10px 20px;
    font-family: inherit;
    font-size: 16px;
    cursor: pointer;
    margin-top: 10px;
    box-shadow: 0 0 10px #0ff;
  }
  button:hover { background: #fff; }
  #titleScreen {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 10, 0.85);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 30;
    color: #0ff;
    text-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
    cursor: pointer;
    touch-action: none;
  }
  #titleScreen h1 {
    font-size: 2.5rem;
    margin-bottom: 20px;
    text-align: center;
    animation: glow 1.5s ease-in-out infinite alternate;
  }
  #titleScreen p {
    font-size: 1.5rem;
    animation: blink 1.2s infinite;
  }
  @keyframes glow {
    from { text-shadow: 0 0 10px #0ff; }
    to { text-shadow: 0 0 20px #0ff, 0 0 30px #0ff; }
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<div id="titleScreen" onclick="startGame()">
  <h1>P-Knuckles<br>Space Adventure</h1>
  <p>Tap to Start</p>
</div>
<div id="ui" style="display:none;">
  Score: <span id="score">0</span> | Wave: <span id="wave">1</span> | Lives: <span id="lives">3</span> | Weapon: <span id="weapon">Laser</span>
</div>
<div id="gameOver">
  <h1>GAME OVER</h1>
  <p>Final Score: <span id="finalScore">0</span></p>
  <button onclick="restart()">Restart</button>
</div>
<div id="victoryScreen">
  <h1>LEVEL COMPLETE!</h1>
  <p>You won P-Knuckle’s phone number:<br><strong>858-245-3935</strong></p>
  <button onclick="restart()">Play Again</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

// Game state
let score = 0, wave = 1, lives = 3, gameOver = false, gameStarted = false;
let level = 1;
let bossActive = false;
let levelWon = false;
let keys = {};
let currentWeapon = 'laser';
let weaponTimer = 0;
const WEAPON_DURATION = 10000;
const LEVEL1_WAVES = 2; // Short level 1: 2 waves then boss

// Entities
let player, bullets = [], enemies = [], powerups = [], particles = [], stars = [];
let boss = null;

// Stars for background
for (let i = 0; i < 150; i++) {
  stars.push({
    x: Math.random() * W,
    y: Math.random() * H,
    size: Math.random() * 2,
    speed: 0.5 + Math.random() * 2
  });
}

class Player {
  constructor() {
    this.x = W / 2;
    this.y = H - 60;
    this.w = 40;
    this.h = 50;
    this.speed = 6;
    this.shootCooldown = 0;
  }
  update() {
    if (keys['ArrowLeft'] || keys['a']) this.x = Math.max(20, this.x - this.speed);
    if (keys['ArrowRight'] || keys['d']) this.x = Math.min(W - 20, this.x + this.speed);
    if (keys['ArrowUp'] || keys['w']) this.y = Math.max(H / 2, this.y - this.speed);
    if (keys['ArrowDown'] || keys['s']) this.y = Math.min(H - 30, this.y + this.speed);
    this.shootCooldown = Math.max(0, this.shootCooldown - 1);
    if (((keys[' '] || keys['Space']) || touching) && this.shootCooldown === 0) {
      this.shoot();
    }
  }
  shoot() {
    const rate = currentWeapon === 'rapid' ? 5 : 12;
    this.shootCooldown = rate;
    switch (currentWeapon) {
      case 'laser':
        bullets.push(new Bullet(this.x, this.y - 20, 0, -10, '#0ff', 'laser'));
        break;
      case 'triple':
        bullets.push(new Bullet(this.x, this.y - 20, 0, -9, '#0f0', 'triple'));
        bullets.push(new Bullet(this.x, this.y - 20, -3, -8, '#0f0', 'triple'));
        bullets.push(new Bullet(this.x, this.y - 20, 3, -8, '#0f0', 'triple'));
        break;
      case 'rapid':
        bullets.push(new Bullet(this.x, this.y - 20, 0, -12, '#ff0', 'rapid'));
        break;
      case 'homing':
        bullets.push(new Bullet(this.x, this.y - 20, 0, -6, '#f00', 'homing'));
        break;
      case 'plasma':
        bullets.push(new Bullet(this.x, this.y - 20, 0, -7, '#f0f', 'plasma'));
        break;
      case 'bomb':
        bullets.push(new Bullet(this.x, this.y - 20, 0, -5, '#f80', 'bomb'));
        break;
    }
  }
  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.fillStyle = '#0ff';
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#0ff';
    ctx.beginPath();
    ctx.moveTo(0, -25);
    ctx.lineTo(-15, 20);
    ctx.lineTo(15, 20);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(0, -5, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  hit() {
    lives--;
    createExplosion(this.x, this.y, '#0ff', 40);
    if (lives <= 0) {
      gameOver = true;
      document.getElementById('gameOver').style.display = 'block';
      document.getElementById('finalScore').textContent = score;
    } else {
      this.x = W / 2;
      this.y = H - 60;
    }
  }
}

class Bullet {
  constructor(x, y, vx, vy, color, type) {
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.color = color;
    this.type = type;
    this.life = 200;
    this.w = type === 'bomb' ? 12 : type === 'plasma' ? 8 : 4;
    this.h = 12;
  }
  update() {
    if (this.type === 'homing' && enemies.length > 0) {
      let nearest = enemies.reduce((a, b) => Math.hypot(a.x - this.x, a.y - this.y) < Math.hypot(b.x - this.x, b.y - this.y) ? a : b);
      let dx = nearest.x - this.x;
      let dy = nearest.y - this.y;
      let dist = Math.hypot(dx, dy) || 1;
      this.vx += (dx / dist) * 0.4;
      this.vy += (dy / dist) * 0.4;
      let spd = Math.hypot(this.vx, this.vy);
      if (spd > 8) { this.vx *= 8 / spd; this.vy *= 8 / spd; }
    }
    this.x += this.vx;
    this.y += this.vy;
    this.life--;
    if (Math.random() < 0.6) {
      particles.push(new Particle(this.x, this.y, this.color, 2, 15));
    }
    return this.life > 0 && this.y > -20 && this.y < H + 20 && this.x > -20 && this.x < W + 20;
  }
  draw() {
    ctx.save();
    ctx.fillStyle = this.color;
    ctx.shadowBlur = 10;
    ctx.shadowColor = this.color;
    if (this.type === 'plasma') {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.w, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.w * 1.5, 0, Math.PI * 2);
      ctx.globalAlpha = 0.3;
      ctx.fill();
    } else if (this.type === 'bomb') {
      ctx.fillRect(this.x - 6, this.y - 6, 12, 12);
    } else {
      ctx.fillRect(this.x - 2, this.y - 6, 4, 12);
    }
    ctx.restore();
  }
  explode() {
    if (this.type === 'bomb') {
      createExplosion(this.x, this.y, '#f80', 60);
      enemies.forEach(e => {
        if (Math.hypot(e.x - this.x, e.y - this.y) < 80) e.hp -= 3;
      });
    }
  }
}

class Enemy {
  constructor(x, y, type = 'basic') {
    this.x = x;
    this.y = y;
    this.type = type;
    this.speed = 1 + wave * 0.2 + Math.random();
    this.w = 30;
    this.h = 30;
    this.hp = type === 'tough' ? 3 : 1;
    this.color = type === 'tough' ? '#f44' : '#f0f';
    this.shootTimer = 60 + Math.random() * 120;
  }
  update() {
    this.y += this.speed;
    this.x += Math.sin(this.y * 0.02) * 1.5;
    if (this.y > H + 40) return false;
    this.shootTimer--;
    if (this.shootTimer <= 0 && Math.random() < 0.3) {
      bullets.push(new Bullet(this.x, this.y + 15, 0, 4, '#f00', 'enemy'));
      this.shootTimer = 90 + Math.random() * 60;
    }
    return true;
  }
  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.fillStyle = this.color;
    ctx.shadowBlur = 10;
    ctx.shadowColor = this.color;
    ctx.beginPath();
    ctx.moveTo(0, 15);
    ctx.lineTo(-15, -10);
    ctx.lineTo(0, -5);
    ctx.lineTo(15, -10);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.fillRect(-6, -2, 4, 4);
    ctx.fillRect(2, -2, 4, 4);
    ctx.restore();
  }
  destroy() {
    score += this.hp * 100 * wave;
    createExplosion(this.x, this.y, this.color, 30);
    if (Math.random() < 0.25) {
      const types = ['triple', 'rapid', 'homing', 'plasma', 'bomb'];
      powerups.push(new Powerup(this.x, this.y, types[Math.floor(Math.random() * types.length)]));
    }
  }
}

class Boss {
  constructor() {
    this.name = 'R-Gyle';
    this.x = W / 2;
    this.y = 80;
    this.w = 80;
    this.h = 70;
    this.hp = 30;
    this.maxHp = 30;
    this.speed = 2;
    this.dir = 1;
    this.color = '#f44';
    this.shootTimer = 40;
    this.phase = 1;
  }
  update() {
    // Side to side movement
    this.x += this.speed * this.dir;
    if (this.x < 60 || this.x > W - 60) this.dir *= -1;
    // Occasional dive
    if (Math.random() < 0.005) {
      this.y = Math.min(200, this.y + 20);
    } else if (this.y > 80) {
      this.y -= 0.5;
    }

    this.shootTimer--;
    if (this.shootTimer <= 0) {
      // Spread shot
      for (let i = -2; i <= 2; i++) {
        bullets.push(new Bullet(this.x, this.y + 30, i * 1.5, 5 + Math.random(), '#f00', 'enemy'));
      }
      this.shootTimer = this.hp < 15 ? 30 : 50;
    }
    return true;
  }
  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.fillStyle = this.color;
    ctx.shadowBlur = 20;
    ctx.shadowColor = this.color;
    // Larger boss shape
    ctx.beginPath();
    ctx.moveTo(0, 35);
    ctx.lineTo(-40, -20);
    ctx.lineTo(-20, -30);
    ctx.lineTo(0, -10);
    ctx.lineTo(20, -30);
    ctx.lineTo(40, -20);
    ctx.closePath();
    ctx.fill();
    // Eyes
    ctx.fillStyle = '#fff';
    ctx.fillRect(-15, -5, 8, 8);
    ctx.fillRect(7, -5, 8, 8);
    ctx.fillStyle = '#f00';
    ctx.fillRect(-13, -3, 4, 4);
    ctx.fillRect(9, -3, 4, 4);
    ctx.restore();

    // Health bar
    ctx.fillStyle = '#333';
    ctx.fillRect(this.x - 40, this.y - 50, 80, 8);
    ctx.fillStyle = '#0f0';
    ctx.fillRect(this.x - 40, this.y - 50, 80 * (this.hp / this.maxHp), 8);
    // Name
    ctx.fillStyle = '#0ff';
    ctx.font = '14px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(this.name, this.x, this.y - 60);
  }
  destroy() {
    score += 5000;
    createExplosion(this.x, this.y, this.color, 80);
    // Extra explosions
    for (let i = 0; i < 5; i++) {
      setTimeout(() => createExplosion(this.x + (Math.random()-0.5)*60, this.y + (Math.random()-0.5)*40, '#f80', 30), i * 100);
    }
  }
  hit() {
    this.hp--;
    if (this.hp <= 0) {
      this.destroy();
      return true; // destroyed
    }
    return false;
  }
}

class Powerup {
  constructor(x, y, type) {
    this.x = x;
    this.y = y;
    this.type = type;
    this.vy = 1.5;
    this.life = 400;
  }
  update() {
    this.y += this.vy;
    this.life--;
    return this.life > 0 && this.y < H + 20;
  }
  draw() {
    ctx.save();
    ctx.fillStyle = this.getColor();
    ctx.shadowBlur = 15;
    ctx.shadowColor = this.getColor();
    ctx.beginPath();
    ctx.arc(this.x, this.y, 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '10px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(this.type[0].toUpperCase(), this.x, this.y + 3);
    ctx.restore();
  }
  getColor() {
    const colors = { triple: '#0f0', rapid: '#ff0', homing: '#f00', plasma: '#f0f', bomb: '#f80' };
    return colors[this.type] || '#fff';
  }
  collect() {
    currentWeapon = this.type;
    weaponTimer = WEAPON_DURATION;
    document.getElementById('weapon').textContent = this.type.charAt(0).toUpperCase() + this.type.slice(1);
  }
}

class Particle {
  constructor(x, y, color, size, life) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 6;
    this.vy = (Math.random() - 0.5) * 6;
    this.color = color;
    this.size = size;
    this.life = life;
    this.maxLife = life;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life--;
    this.vy += 0.05;
    return this.life > 0;
  }
  draw() {
    ctx.globalAlpha = this.life / this.maxLife;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function createExplosion(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    particles.push(new Particle(x, y, color, 2 + Math.random() * 3, 20 + Math.random() * 30));
  }
}

function spawnWave() {
  const count = level === 1 ? (3 + wave * 2) : (5 + wave * 2); // Shorter for level 1
  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      if (!gameOver && !levelWon) {
        const x = 50 + Math.random() * (W - 100);
        enemies.push(new Enemy(x, -40, Math.random() < 0.2 ? 'tough' : 'basic'));
      }
    }, i * 250);
  }
}

function updateUI() {
  document.getElementById('score').textContent = score;
  document.getElementById('wave').textContent = wave;
  document.getElementById('lives').textContent = lives;
}

function gameLoop() {
  if (!gameStarted || gameOver) return;

  stars.forEach(s => {
    s.y += s.speed;
    if (s.y > H) s.y = 0;
  });

  player.update();

  bullets = bullets.filter(b => {
    if (!b.update()) return false;
    if (b.type !== 'enemy') {
      // Check regular enemies
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        if (Math.abs(b.x - e.x) < 20 && Math.abs(b.y - e.y) < 20) {
          e.hp--;
          b.explode();
          if (e.hp <= 0) {
            e.destroy();
            enemies.splice(i, 1);
          }
          return false;
        }
      }
      // Check boss
      if (boss && Math.abs(b.x - boss.x) < 40 && Math.abs(b.y - boss.y) < 35) {
        b.explode();
        if (boss.hit()) {
          boss = null;
          bossActive = false;
          // Level 1 complete
          levelWon = true;
          gameOver = true; // pause loop
          document.getElementById('victoryScreen').style.display = 'block';
        }
        return false;
      }
    } else {
      if (Math.abs(b.x - player.x) < 20 && Math.abs(b.y - player.y) < 20) {
        player.hit();
        return false;
      }
    }
    return true;
  });

  // Update boss
  if (boss) {
    boss.update();
  }

  enemies = enemies.filter(e => e.update());

  powerups = powerups.filter(p => {
    if (!p.update()) return false;
    if (Math.abs(p.x - player.x) < 25 && Math.abs(p.y - player.y) < 25) {
      p.collect();
      return false;
    }
    return true;
  });

  particles = particles.filter(p => p.update());

  if (weaponTimer > 0) {
    weaponTimer -= 16;
    if (weaponTimer <= 0) {
      currentWeapon = 'laser';
      document.getElementById('weapon').textContent = 'Laser';
    }
  }

  if (enemies.length === 0 && !bossActive && !levelWon && !gameOver) {
    if (level === 1 && wave >= LEVEL1_WAVES) {
      // Spawn the boss
      boss = new Boss();
      bossActive = true;
      document.getElementById('wave').textContent = 'BOSS';
    } else {
      wave++;
      updateUI();
      spawnWave();
    }
  }

  ctx.fillStyle = 'rgba(0,0,10,0.3)';
  ctx.fillRect(0, 0, W, H);

  stars.forEach(s => {
    ctx.fillStyle = '#fff';
    ctx.fillRect(s.x, s.y, s.size, s.size);
  });

  particles.forEach(p => p.draw());
  powerups.forEach(p => p.draw());
  enemies.forEach(e => e.draw());
  if (boss) boss.draw();
  bullets.forEach(b => b.draw());
  player.draw();

  requestAnimationFrame(gameLoop);
}

function startGame() {
  if (gameStarted) return;
  gameStarted = true;
  document.getElementById('titleScreen').style.display = 'none';
  document.getElementById('ui').style.display = 'block';
  player = new Player();
  updateUI();
  spawnWave();
  gameLoop();
}

function restart() {
  score = 0; wave = 1; lives = 3; gameOver = false; levelWon = false;
  level = 1; bossActive = false; boss = null;
  currentWeapon = 'laser';
  weaponTimer = 0;
  bullets = []; enemies = []; powerups = []; particles = [];
  gameStarted = true;
  document.getElementById('gameOver').style.display = 'none';
  document.getElementById('victoryScreen').style.display = 'none';
  document.getElementById('titleScreen').style.display = 'none';
  document.getElementById('ui').style.display = 'block';
  document.getElementById('weapon').textContent = 'Laser';
  player = new Player();
  updateUI();
  spawnWave();
  gameLoop();
}

// Input
window.addEventListener('keydown', e => { keys[e.key] = true; if (e.key === ' ') e.preventDefault(); });
window.addEventListener('keyup', e => { keys[e.key] = false; });

// Touch controls for iPhone / mobile
let touching = false;
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  touching = true;
  const touch = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  player.x = Math.max(20, Math.min(W - 20, (touch.clientX - rect.left) * scaleX));
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (touching && e.touches.length > 0) {
    const touch = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    player.x = Math.max(20, Math.min(W - 20, (touch.clientX - rect.left) * scaleX));
  }
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
  e.preventDefault();
  touching = false;
}, { passive: false });

canvas.addEventListener('touchcancel', (e) => {
  touching = false;
}, { passive: false });

// Keyboard start
window.addEventListener('keydown', e => {
  if (!gameStarted && (e.key === ' ' || e.key === 'Enter')) {
    e.preventDefault();
    startGame();
  }
});

// Touch on title screen
document.getElementById('titleScreen').addEventListener('touchstart', (e) => {
  e.preventDefault();
  startGame();
}, { passive: false });
</script>
</body>
</html>
