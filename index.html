<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ross Lake Fishing Adventure</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#071824;color:#effaff;font-family:system-ui,-apple-system,sans-serif}
button,select{font:inherit}
button{cursor:pointer;touch-action:manipulation}
button:focus-visible,select:focus-visible{outline:3px solid white;outline-offset:2px}
#selection{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:18px;background:linear-gradient(#285f72,#0b293a 65%,#06151f)}
.panel{width:min(100%,480px);text-align:center}
.eyebrow{letter-spacing:.24em;font-size:.72rem;font-weight:800;color:#b6f1ff}
h1{font-size:clamp(2.7rem,11vw,4.4rem);line-height:1;margin:12px 0;color:white;text-shadow:0 4px #075985}
.subtitle{font-size:.76rem;letter-spacing:.12em;color:#c9e8f1;margin-bottom:18px}
#anglerGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}
.angler{border:2px solid #476777;background:#102f40;color:white;border-radius:14px;padding:10px 5px;min-height:100px}
.angler.selected{border-color:#67e8f9;background:#17556b;box-shadow:0 0 15px #67e8f944}
.avatar{font-size:2rem;display:block}
.angler strong{display:block}
.angler small{display:block;color:#c2dce7;margin-top:3px}
#backupRow{margin:12px 0;color:#cce5ee;font-size:.85rem}
select{background:#123547;color:white;border:1px solid #6b99a8;border-radius:9px;padding:8px;max-width:100%}
.primary{background:linear-gradient(100deg,#38bdf8,#67e8f9);color:#062436;font-weight:900;border:0;border-radius:12px;padding:14px 18px}
#startButton{width:min(100%,300px);font-size:1rem}
#selectedInfo{font-size:.85rem;color:#d5eef6;margin-top:12px}
#game{display:none;height:100dvh;min-height:440px;flex-direction:column;overflow:hidden}
#top{display:flex;justify-content:space-between;align-items:center;gap:5px;padding:9px;background:#0b2432;border-bottom:1px solid #2c5263;font-size:.78rem}
#anglerName{color:#8beaff;font-weight:900}
#status{min-height:46px;display:grid;place-items:center;text-align:center;padding:7px 10px;background:#0d2a3a;font-size:.84rem;font-weight:750}
#stats{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;background:#071d29;color:#c5eaf5;font-size:.74rem}
#scene{display:block;width:100%;flex:1;min-height:0;background:#104b61}
#controls{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;padding:9px 7px calc(9px + env(safe-area-inset-bottom));background:#06151f;border-top:1px solid #29495a}
.action{flex:1 1 27%;min-width:78px;max-width:190px;min-height:45px;border:0;border-radius:10px;padding:8px 5px;background:linear-gradient(145deg,#38bdf8,#67e8f9);color:#052436;font-size:.77rem;font-weight:900}
.action.green{background:linear-gradient(145deg,#86efac,#4ade80)}
.action.orange{background:linear-gradient(145deg,#fde68a,#fb923c)}
.action.gray{background:linear-gradient(145deg,#a1b2c3,#64748b)}
.action:disabled{opacity:.35}
.overlay{display:none;position:fixed;z-index:5;top:50%;left:50%;transform:translate(-50%,-50%);width:min(92%,400px);max-height:88dvh;overflow:auto;padding:18px;border:2px solid #67e8f9;border-radius:18px;background:linear-gradient(160deg,#17475b,#071827);box-shadow:0 0 0 100vmax #000b;text-align:center}
.overlay h2{margin:0;color:#a5f3fc}
#catchCanvas{width:100%;height:auto;margin-top:10px;border-radius:10px}
.details{font-size:.88rem;line-height:1.8;margin:10px 0}
.overlay button{width:100%;margin-top:7px}
.journalEntry{text-align:left;padding:9px;margin:7px 0;border:1px solid #3b6475;border-radius:9px;background:#0c2b3b;font-size:.83rem;line-height:1.6}
@media(max-height:650px){.subtitle{margin-bottom:8px}.angler{min-height:75px;padding:5px}.avatar{font-size:1.5rem}#controls{padding-top:5px;padding-bottom:5px}.action{min-height:40px}}
</style>
</head>
<body>

<section id="selection">
 <div class="panel">
  <div class="eyebrow">PACIFIC NORTHWEST</div>
  <h1>ROSS LAKE</h1>
  <div class="subtitle">WILDERNESS FISHING ADVENTURE</div>
  <p>CHOOSE YOUR ANGLER</p>
  <div id="anglerGrid">
   <button type="button" class="angler selected" data-angler="0"><span class="avatar">🧔🏻</span><strong>Clay</strong><small>Steady & patient</small></button>
   <button type="button" class="angler" data-angler="1"><span class="avatar">🧢</span><strong>Ryan</strong><small>Fast caster</small></button>
   <button type="button" class="angler" data-angler="2"><span class="avatar">🧔🏽</span><strong>Justin</strong><small>Lucky angler</small></button>
   <button type="button" class="angler" data-angler="3"><span class="avatar">🧔🏼‍♂️</span><strong>Bob</strong><small>Trophy hunter</small></button>
  </div>
  <div id="backupRow">Or choose here:
   <select id="anglerSelect" aria-label="Choose angler">
    <option value="0">Clay — Steady & patient</option>
    <option value="1">Ryan — Fast caster</option>
    <option value="2">Justin — Lucky angler</option>
    <option value="3">Bob — Trophy hunter</option>
   </select>
  </div>
  <button type="button" class="primary" id="startButton">START FISHING</button>
  <div id="selectedInfo" aria-live="polite">Clay selected.</div>
 </div>
</section>

<section id="game">
 <header id="top">
  <span id="anglerName">Clay</span>
  <strong>ROSS LAKE</strong>
  <span id="count">Catches: 0</span>
 </header>
 <div id="status" aria-live="polite">Watch the water and cast your line.</div>
 <div id="stats"><span id="biggest">Biggest: 0.00 lb</span><span id="totalWeight">Total: 0.00 lb</span></div>
 <canvas id="scene" aria-label="Lake scene showing underwater fish and your fishing line"></canvas>
 <nav id="controls">
  <button type="button" id="castButton" class="action">🎣 CAST</button>
  <button type="button" id="hookButton" class="action orange" disabled>⚡ SET HOOK</button>
  <button type="button" id="reelButton" class="action green" disabled>⬆ REEL IN</button>
  <button type="button" id="runButton" class="action gray" disabled>↔ LET IT RUN</button>
  <button type="button" id="journalButton" class="action">📖 JOURNAL</button>
  <button type="button" id="backButton" class="action gray">↩ ANGLERS</button>
 </nav>
</section>

<div id="catchScreen" class="overlay">
 <h2>FISH LANDED!</h2>
 <canvas id="catchCanvas" width="600" height="300"></canvas>
 <div id="catchDetails" class="details"></div>
 <button type="button" id="continueButton" class="primary">KEEP FISHING</button>
</div>

<div id="journalScreen" class="overlay">
 <h2>FISHING JOURNAL</h2>
 <div id="journalStats" class="details"></div>
 <div id="journalList"></div>
 <button type="button" id="journalClose" class="primary">CLOSE</button>
</div>

<script>
(function(){
'use strict';

const $=id=>document.getElementById(id);
const canvas=$('scene'),ctx=canvas.getContext('2d');
const cc=$('catchCanvas'),cg=cc.getContext('2d');

const anglers=[
 {name:'Clay',trait:'Steady & patient',shirt:'#607c49',skin:'#c58c68',hair:'#493126',hat:'#c4a06a',skill:1.15,luck:1},
 {name:'Ryan',trait:'Fast caster',shirt:'#315f8c',skin:'#e0b18a',hair:'#49352a',hat:'#d9c8a1',skill:1.3,luck:1},
 {name:'Justin',trait:'Lucky angler',shirt:'#a65e43',skin:'#c58a62',hair:'#30251f',hat:'#496044',skill:1,luck:1.45},
 {name:'Bob',trait:'Trophy hunter',shirt:'#75618c',skin:'#e2ba98',hair:'#aaa08c',hat:'#907750',skill:1,luck:1.15}
];

const species=[
 {name:'Rainbow Trout',min:.7,max:5.5,rarity:34,body:'#c6d6c6',back:'#587d59',belly:'#eee2c1',spot:'#4c5747'},
 {name:'Kokanee Salmon',min:1,max:4.5,rarity:22,body:'#d87869',back:'#65766d',belly:'#f3d3b2',spot:'#ad4d43'},
 {name:'Smallmouth Bass',min:.8,max:5.8,rarity:24,body:'#b7b27a',back:'#66774a',belly:'#e7dca9',spot:'#4b6142'},
 {name:'Bull Trout',min:2,max:12,rarity:12,body:'#b9c4b4',back:'#344e4a',belly:'#d8dfc8',spot:'#c77b60'},
 {name:'Lake Trout',min:3,max:20,rarity:8,body:'#bdc6b6',back:'#50635d',belly:'#e3dfc5',spot:'#384b46'}
];

let selected=0,W=1,H=1,DPR=1,time=0,last=0,raf=0;
let started=false,mode='idle',fish=[],particles=[],target=null,hooked=null;
let lure={x:0,y:0},castProgress=0,waitTime=0,biteTime=0;
let tension=15,distance=1,stamina=100;
let catches=[],totalCaught=0,totalWeight=0,biggest=0;

try{
 const s=JSON.parse(localStorage.getItem('rossLakeStatsV3')||'{}');
 catches=Array.isArray(s.catches)?s.catches:[];
 totalCaught=Number(s.totalCaught)||0;
 totalWeight=Number(s.totalWeight)||0;
 biggest=Number(s.biggest)||0;
}catch(e){}

function save(){
 try{localStorage.setItem('rossLakeStatsV3',JSON.stringify({catches:catches.slice(0,100),totalCaught,totalWeight,biggest}));}catch(e){}
}

function setStatus(s){$('status').textContent=s;}
function rand(a,b){return a+Math.random()*(b-a);}

function chooseAngler(n){
 selected=Math.max(0,Math.min(3,Number(n)||0));
 $('anglerSelect').value=String(selected);
 document.querySelectorAll('.angler').forEach((b,i)=>b.classList.toggle('selected',i===selected));
 $('selectedInfo').textContent=anglers[selected].name+' selected — '+anglers[selected].trait+'.';
}

document.querySelectorAll('.angler').forEach(b=>{
 b.addEventListener('click',()=>chooseAngler(b.dataset.angler));
});
$('anglerSelect').addEventListener('change',e=>chooseAngler(e.target.value));

function stats(){
 $('count').textContent='Catches: '+totalCaught;
 $('biggest').textContent='Biggest: '+biggest.toFixed(2)+' lb';
 $('totalWeight').textContent='Total: '+totalWeight.toFixed(2)+' lb';
}

function resize(){
 const r=canvas.getBoundingClientRect();
 if(!r.width||!r.height)return;
 DPR=Math.min(window.devicePixelRatio||1,2);W=r.width;H=r.height;
 canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
 ctx.setTransform(DPR,0,0,DPR,0,0);
 makeFish();
 draw();
}

function makeFish(){
 fish=[];
 for(let i=0;i<17;i++){
  const sp=species[Math.floor(Math.random()*species.length)];
  fish.push({
   sp,x:rand(0,W),y:rand(H*.69,H*.96),
   size:rand(8,14)*(sp===species[4]?1.3:1),
   speed:rand(9,24),dir:Math.random()<.5?-1:1,
   phase:rand(0,6.28),state:'swim',alpha:rand(.65,.95)
  });
 }
}

function setButtons(){
 $('castButton').disabled=mode!=='idle';
 $('hookButton').disabled=mode!=='bite';
 $('reelButton').disabled=mode!=='fight';
 $('runButton').disabled=mode!=='fight';
}

$('startButton').addEventListener('click',()=>{
 if(started)return;
 chooseAngler($('anglerSelect').value);
 started=true;
 $('selection').style.display='none';
 $('game').style.display='flex';
 $('anglerName').textContent='🎣 '+anglers[selected].name;
 stats();resize();
 setStatus('Cast into the deep water. Watch the fish swim toward your lure!');
 if(!raf){last=0;raf=requestAnimationFrame(loop);}
});

$('backButton').addEventListener('click',()=>{
 if(mode!=='idle'){setStatus('Finish this cast before changing anglers.');return;}
 started=false;
 $('game').style.display='none';
 $('selection').style.display='flex';
});

function cast(){
 if(!started||mode!=='idle')return;
 mode='casting';castProgress=0;hooked=null;target=null;
 lure.x=W*.5+55;lure.y=H*.66;
 tension=15;stamina=100;distance=1;
 setButtons();
 setStatus('Casting! Watch the line travel down into the deep water.');
}
$('castButton').addEventListener('click',cast);

function beginWaiting(){
 mode='waiting';waitTime=rand(2.5,5.5);
 lure.x=W*.66;lure.y=H*.88;
 setButtons();
 setStatus('Your lure is deep underwater. Watch for a fish approaching!');
}

function startApproach(){
 const available=fish.filter(f=>f.state==='swim');
 if(!available.length){makeFish();}
 const choices=fish.filter(f=>f.state==='swim');
 target=choices[Math.floor(Math.random()*choices.length)];
 target.state='approach';
 mode='approach';
 setButtons();
 setStatus('🐟 A fish has spotted your bait! Watch it swim toward the lure...');
}

function bite(){
 mode='bite';biteTime=3.2;
 if(target){target.state='bite';target.x=lure.x;target.y=lure.y;}
 setButtons();
 setStatus('🐟 BITE! The fish is at your lure! Tap SET HOOK now!');
}

$('hookButton').addEventListener('click',()=>{
 if(mode!=='bite'||!target)return;
 const sp=target.sp,a=anglers[selected];
 let weight=(sp.min+Math.random()*(sp.max-sp.min))* (a.name==='Bob'?1.15:1);
 weight=Math.min(sp.max,weight);
 hooked={sp,weight,length:Math.round(7+weight*3.1+Math.random()*5),
  size:Math.max(23,Math.min(60,18+weight*1.5)),x:target.x,y:target.y,phase:rand(0,6.28)};
 target.state='caught';target=null;
 mode='fight';distance=1;stamina=100;tension=24;
 setButtons();splash(lure.x,lure.y,22);
 setStatus('HOOK SET! The fish is fighting below the boat. Reel it in!');
});

function reel(){
 if(mode!=='fight'||!hooked)return;
 if(tension>74){setStatus('The fish is pulling hard! Tap LET IT RUN to relax the line.');return;}
 distance-=.075*anglers[selected].skill;
 stamina-=7;tension+=5;
 if(distance<=.04||stamina<=0){landFish();return;}
 setStatus('Reeling in! Keep watching your fish beneath the boat.');
}
$('reelButton').addEventListener('click',reel);

$('runButton').addEventListener('click',()=>{
 if(mode!=='fight'||!hooked)return;
 tension=Math.max(5,tension-27);
 distance=Math.min(1,distance+.012);
 stamina=Math.max(0,stamina-2);
 setStatus('Letting the fish run. Your line tension is relaxing.');
 if(stamina<=0)landFish();
});

function landFish(){
 if(!hooked)return;
 const f=hooked,entry={
  name:f.sp.name,weight:Number(f.weight.toFixed(2)),length:f.length,
  angler:anglers[selected].name,time:new Date().toLocaleString(),
  body:f.sp.body,back:f.sp.back,belly:f.sp.belly,spot:f.sp.spot,size:f.size
 };
 catches.unshift(entry);catches=catches.slice(0,100);
 totalCaught++;totalWeight+=entry.weight;biggest=Math.max(biggest,entry.weight);
 save();stats();hooked=null;mode='idle';tension=15;setButtons();
 showCatch(entry);
}

function showCatch(f){
 $('catchDetails').replaceChildren();
 [['Species',f.name],['Weight',f.weight.toFixed(2)+' lb'],['Length',f.length+' inches'],['Angler',f.angler],['Catch time',f.time]].forEach(([k,v])=>{
  const row=document.createElement('div'),strong=document.createElement('strong');
  strong.textContent=k+': ';row.appendChild(strong);row.appendChild(document.createTextNode(v));
  $('catchDetails').appendChild(row);
 });
 drawCatch(f);$('catchScreen').style.display='block';
 setStatus('Fish landed! Your weight and catch statistics have been saved.');
}

function drawCatch(f){
 const g=cg,w=cc.width,h=cc.height;
 const sky=g.createLinearGradient(0,0,0,h);
 sky.addColorStop(0,'#92c6d1');sky.addColorStop(.5,'#397c8b');sky.addColorStop(1,'#10394a');
 g.fillStyle=sky;g.fillRect(0,0,w,h);
 g.fillStyle='#496b61';g.beginPath();
 g.moveTo(0,145);g.lineTo(90,40);g.lineTo(175,122);g.lineTo(290,18);g.lineTo(405,115);g.lineTo(510,38);g.lineTo(600,135);g.lineTo(600,300);g.lineTo(0,300);g.fill();
 g.fillStyle='#226b7c';g.fillRect(0,150,w,150);
 drawFish(g,w/2,170,Math.min(105,40+f.weight*2),f,1,false);
 g.fillStyle='white';g.textAlign='center';g.font='bold 20px system-ui';
 g.fillText('ROSS LAKE TROPHY',w/2,30);
 g.font='bold 17px system-ui';g.fillText(f.weight.toFixed(2)+' LB  •  '+f.length+' IN',w/2,278);
}

$('continueButton').addEventListener('click',()=>{$('catchScreen').style.display='none';setStatus('Ready to cast again. Look for fish swimming below the boat.');});

function journal(){
 $('journalStats').textContent='Total catches: '+totalCaught+' · Total weight: '+totalWeight.toFixed(2)+' lb · Biggest: '+biggest.toFixed(2)+' lb';
 $('journalList').replaceChildren();
 if(!catches.length){
  const d=document.createElement('div');d.className='journalEntry';d.textContent='No fish landed yet. Cast your line to start!';
  $('journalList').appendChild(d);
 }else catches.forEach((f,i)=>{
  const d=document.createElement('div');d.className='journalEntry';
  d.textContent='#'+(i+1)+' · '+f.name+' — '+f.weight.toFixed(2)+' lb, '+f.length+' in · '+f.angler+' · '+f.time;
  $('journalList').appendChild(d);
 });
 $('journalScreen').style.display='block';
}
$('journalButton').addEventListener('click',journal);
$('journalClose').addEventListener('click',()=>{$('journalScreen').style.display='none';});

function splash(x,y,n){
 for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-60,60),vy:rand(-90,-15),life:rand(.3,.8),size:rand(1,4)});
}

function background(){
 const sky=ctx.createLinearGradient(0,0,0,H*.55);
 sky.addColorStop(0,'#719fb2');sky.addColorStop(1,'#d3d9c7');
 ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#6c8779';ctx.beginPath();ctx.moveTo(0,H*.53);
 for(let x=0;x<=W+15;x+=18)ctx.lineTo(x,H*(.43+Math.sin(x*.018)*.03));
 ctx.lineTo(W,H*.62);ctx.lineTo(0,H*.62);ctx.fill();
 ctx.fillStyle='#234d3b';
 for(let x=0;x<W;x+=20){
  const y=H*(.52+Math.sin(x*.025)*.02);
  ctx.beginPath();ctx.moveTo(x,y-25);ctx.lineTo(x-12,y+3);ctx.lineTo(x+12,y+3);ctx.fill();
 }
 const water=ctx.createLinearGradient(0,H*.54,0,H);
 water.addColorStop(0,'#5ca4aa');water.addColorStop(.25,'#287b8c');water.addColorStop(1,'#061e35');
 ctx.fillStyle=water;ctx.fillRect(0,H*.54,W,H*.46);

 // Underwater depth bands make the lure's depth obvious.
 ctx.fillStyle='rgba(8,45,66,.18)';ctx.fillRect(0,H*.68,W,H*.32);
 ctx.fillStyle='rgba(2,22,43,.22)';ctx.fillRect(0,H*.83,W,H*.17);
 ctx.fillStyle='rgba(190,239,244,.55)';ctx.font='bold 11px system-ui';ctx.textAlign='left';
 ctx.fillText('UNDERWATER',10,H*.70);
 ctx.fillStyle='rgba(210,239,245,.22)';
 for(let i=0;i<40;i++){
  const y=H*.57+((i*19+time*7)%(H*.4));
  const x=(i*73+Math.sin(time+i)*15)%W;
  ctx.fillRect(x,y,12+(i%5)*5,1);
 }
}

function boat(){
 const x=W*.5,y=H*.70+Math.sin(time*1.2)*2,a=anglers[selected];
 ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(x,y+20,78,8,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#65452f';ctx.beginPath();ctx.moveTo(x-76,y);ctx.lineTo(x+76,y);ctx.lineTo(x+53,y+24);ctx.lineTo(x-53,y+24);ctx.closePath();ctx.fill();
 ctx.fillStyle='#c2a16b';ctx.beginPath();ctx.moveTo(x-68,y-5);ctx.lineTo(x+68,y-5);ctx.lineTo(x+53,y+10);ctx.lineTo(x-53,y+10);ctx.closePath();ctx.fill();
 ctx.fillStyle=a.shirt;ctx.beginPath();ctx.ellipse(x-4,y-30,18,22,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle=a.skin;ctx.beginPath();ctx.arc(x-4,y-56,13,0,Math.PI*2);ctx.fill();
 ctx.fillStyle=a.hair;ctx.beginPath();ctx.arc(x-4,y-60,13,Math.PI,Math.PI*2);ctx.fill();
 ctx.fillStyle=a.hat;ctx.beginPath();ctx.ellipse(x-4,y-64,20,4,0,0,Math.PI*2);ctx.fill();
 ctx.beginPath();ctx.moveTo(x-14,y-65);ctx.quadraticCurveTo(x-10,y-78,x-3,y-77);ctx.quadraticCurveTo(x+8,y-77,x+9,y-65);ctx.fill();
 ctx.strokeStyle='#3d2b1c';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x+14,y-38);ctx.lineTo(x+43,y-101);ctx.stroke();
 ctx.strokeStyle='#eee1c2';ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(x+43,y-101);ctx.quadraticCurveTo(x+60,y-73,x+55,y-45);ctx.stroke();
}

function drawFish(g,x,y,size,f,alpha=1,flip=true){
 g.save();g.globalAlpha=alpha;g.translate(x,y);if(flip)g.scale(-1,1);
 g.fillStyle=f.back;g.beginPath();g.moveTo(-size*.5,0);g.lineTo(-size*1.05,-size*.4);g.lineTo(-size,0);g.lineTo(-size*1.05,size*.4);g.closePath();g.fill();
 g.beginPath();g.moveTo(-size*.18,-size*.14);g.lineTo(-size*.05,-size*.42);g.lineTo(size*.22,-size*.15);g.closePath();g.fill();
 g.fillStyle=f.back;g.beginPath();g.ellipse(0,0,size*.68,size*.34,0,0,Math.PI*2);g.fill();
 g.fillStyle=f.body;g.beginPath();g.ellipse(size*.04,-size*.02,size*.61,size*.27,0,0,Math.PI*2);g.fill();
 g.fillStyle=f.belly;g.beginPath();g.ellipse(size*.04,size*.13,size*.43,size*.12,0,0,Math.PI);g.fill();
 g.fillStyle=f.back;g.beginPath();g.moveTo(-size*.02,size*.04);g.lineTo(size*.22,size*.3);g.lineTo(size*.32,size*.02);g.fill();
 for(let i=0;i<6;i++){g.fillStyle=f.spot;g.beginPath();g.arc(-size*.25+(i%3)*size*.17,(i%2?1:-1)*size*.1,Math.max(.7,size*.035),0,Math.PI*2);g.fill();}
 g.fillStyle='#fff5dc';g.beginPath();g.arc(size*.5,-size*.06,Math.max(1.3,size*.08),0,Math.PI*2);g.fill();
 g.fillStyle='#15241e';g.beginPath();g.arc(size*.52,-size*.06,Math.max(.7,size*.04),0,Math.PI*2);g.fill();
 g.restore();
}

function school(){
 fish.forEach(f=>{
  if(f.state==='caught')return;
  drawFish(ctx,f.x,f.y,f.size,f.sp,f.alpha);
 });
}

function lineAndLure(){
 if(!['casting','waiting','approach','bite','fight'].includes(mode))return;
 const sx=W*.5+54,sy=H*.70-91;
 let ex=lure.x,ey=lure.y;
 if(mode==='fight'&&hooked){ex=hooked.x;ey=hooked.y;}
 ctx.strokeStyle=tension>70?'#ffe3a2':'#fff5dc';ctx.lineWidth=1.6;
 ctx.beginPath();ctx.moveTo(sx,sy);
 ctx.quadraticCurveTo((sx+ex)/2+Math.sin(time*2)*4,(sy+ey)/2,ex,ey);ctx.stroke();

 // Bright, unmistakable lure underwater.
 if(mode!=='fight'){
  ctx.fillStyle='#ffdb4d';ctx.beginPath();ctx.ellipse(ex,ey,7,4,Math.sin(time*4)*.2,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#fff7da';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(ex+3,ey+2);ctx.lineTo(ex+5,ey+7);ctx.quadraticCurveTo(ex+9,ey+7,ex+7,ey+3);ctx.stroke();
 }
 if(mode==='bite'){
  for(let i=0;i<3;i++){ctx.strokeStyle='rgba(255,255,255,'+(.6-i*.15)+')';ctx.beginPath();ctx.ellipse(ex,ey,12+i*8,4+i*2,0,0,Math.PI*2);ctx.stroke();}
 }
}

function drawHooked(){
 if(!hooked)return;
 drawFish(ctx,hooked.x,hooked.y,hooked.size,hooked.sp,1);
 ctx.strokeStyle='#ffe7a0';ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(hooked.x,hooked.y,hooked.size*1.3,hooked.size*.6,0,0,Math.PI*2);ctx.stroke();
}

function drawParticles(dt){
 particles=particles.filter(p=>p.life>0);
 for(const p of particles){
  p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=160*dt;p.life-=dt;
  ctx.globalAlpha=Math.max(0,p.life/.8);ctx.fillStyle='#e7ffff';
  ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
 }
 ctx.globalAlpha=1;
}

function draw(){
 if(!W||!H)return;
 ctx.clearRect(0,0,W,H);
 background();school();boat();lineAndLure();drawHooked();
}

function update(dt){
 time+=dt;

 fish.forEach(f=>{
  if(f.state==='caught')return;
  if(f.state==='swim'){
   f.x+=f.speed*f.dir*dt;
   f.y+=Math.sin(time*1.3+f.phase)*dt*3;
   if(f.x<-45)f.x=W+45;if(f.x>W+45)f.x=-45;
  }
 });

 if(mode==='casting'){
  castProgress=Math.min(1,castProgress+dt*1.05);
  const p=castProgress,sx=W*.5+55,sy=H*.70-90;
  const tx=W*.66,ty=H*.88;
  lure.x=sx+(tx-sx)*p;
  lure.y=sy+(ty-sy)*p-Math.sin(p*Math.PI)*H*.09;
  if(p>=1){
   lure.x=tx;lure.y=ty;splash(lure.x,lure.y,16);beginWaiting();
  }
 }else if(mode==='waiting'){
  waitTime-=dt;
  lure.x=W*.66+Math.sin(time*.65)*W*.025;
  lure.y=H*.88+Math.sin(time*1.7)*2;
  if(waitTime<=0)startApproach();
 }else if(mode==='approach'&&target){
  // Fish swims toward the actual lure instead of appearing on the hook.
  const dx=lure.x-target.x,dy=lure.y-target.y;
  const d=Math.hypot(dx,dy)||1;
  const speed=48;
  target.x+=dx/d*speed*dt;
  target.y+=dy/d*speed*dt;
  target.x+=Math.sin(time*4+target.phase)*dt*4;
  target.y+=Math.cos(time*4+target.phase)*dt*3;
  if(d<13){
   target.x=lure.x;target.y=lure.y;
   bite();splash(lure.x,lure.y,10);
  }
 }else if(mode==='bite'){
  biteTime-=dt;
  if(target){target.x=lure.x+Math.sin(time*13)*4;target.y=lure.y+Math.sin(time*15)*3;}
  if(Math.random()<.08)splash(lure.x,lure.y,2);
  if(biteTime<=0){
   if(target)target.state='swim';
   target=null;mode='idle';setButtons();
   setStatus('The fish let go! Cast again and watch for another approach.');
  }
 }else if(mode==='fight'&&hooked){
  hooked.x=W*.5+Math.sin(time*1.7+hooked.phase)*Math.min(W*.28,100)*distance;
  hooked.y=H*.86+Math.sin(time*2.6+hooked.phase)*H*.025;
  tension=Math.max(5,Math.min(88,tension+dt*(Math.sin(time*1.8+hooked.phase)>.75?3:-1)));
  if(tension>82)tension-=dt*8;
 }
 drawParticles(dt);
}

function loop(now){
 raf=requestAnimationFrame(loop);
 const dt=Math.min(.04,Math.max(0,(now-last)/1000||0));last=now;
 update(dt);draw();
}

chooseAngler(0);stats();window.addEventListener('resize',resize);
})();
</script>
</body>
