<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ross Lake — Wilderness Fishing Adventure</title>
<style>
:root{color-scheme:dark;--ink:#eaf7ff;--muted:#9bb9c9;--blue:#38c7ed;--green:#74e2a1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061724;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;touch-action:manipulation}
#selection{height:100dvh;display:grid;place-items:center;padding:18px;background:radial-gradient(ellipse at 50% 10%,#1b6c85 0,transparent 52%),linear-gradient(#09283a,#06131d)}
.panel{width:min(100%,480px);text-align:center}
.eyebrow{font-size:.72rem;letter-spacing:.3em;color:#8de8fa;font-weight:800;text-transform:uppercase}
h1{font-size:clamp(2.7rem,11vw,4.5rem);line-height:1;margin:10px 0 6px;letter-spacing:.04em;text-shadow:0 4px #075985,0 0 32px #38bdf866}
.tagline{color:#b5d7e6;letter-spacing:.16em;font-size:.75rem;margin-bottom:25px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:17px}
.card{border:1px solid #356277;border-radius:17px;background:linear-gradient(145deg,#173d50,#0a2231);color:white;padding:14px 8px;cursor:pointer}
.card.selected{border:2px solid #63e4ff;background:linear-gradient(145deg,#17607b,#103349);box-shadow:0 0 22px #38bdf844}
.avatar{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;margin:0 auto 8px;font-size:1.5rem;font-weight:900;border:2px solid #ffffff50}
.clay{background:linear-gradient(145deg,#a6b6c5,#475569)}
.ryan{background:linear-gradient(145deg,#5bd8f5,#075985)}
.justin{background:linear-gradient(145deg,#86efac,#166534)}
.bob{background:linear-gradient(145deg,#fcd34d,#92400e)}
.card strong,.card small{display:block}
.card small{color:#b5ceda;margin-top:3px;font-size:.7rem}
.primary{border:0;border-radius:14px;background:linear-gradient(100deg,#38bdf8,#67e8f9);color:#052436;font-weight:950;padding:14px 18px;box-shadow:0 4px #0e7490;cursor:pointer}
#start{width:min(100%,300px);opacity:.45}
#start:enabled{opacity:1}
#selectedInfo{color:#b5dced;font-size:.86rem;margin-top:13px}
#game{display:none;flex-direction:column;width:100%;height:100dvh}
#top{min-height:47px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 11px;background:linear-gradient(#102d3e,#071a27);border-bottom:1px solid #214457;font-size:.78rem}
#angler{font-weight:850;color:#7dd3fc}
#place{font-weight:950;letter-spacing:.1em}
#count{color:#a5f3fc;font-weight:800;white-space:nowrap}
#status{min-height:39px;display:grid;place-items:center;text-align:center;padding:6px 10px;background:#0c2637;color:#d9f4ff;font-size:.82rem;font-weight:650;border-bottom:1px solid #1c4054}
#scene{display:block;width:100%;flex:1;min-height:0;background:#0b5269}
#controls{display:flex;align-items:stretch;justify-content:center;gap:8px;padding:9px 9px calc(9px + env(safe-area-inset-bottom));background:#071722;border-top:1px solid #1c4054;flex-wrap:wrap}
.action{flex:1;min-width:70px;max-width:160px;min-height:48px;border:0;border-radius:13px;padding:9px 7px;font-weight:950;font-size:.84rem;color:#052436;background:linear-gradient(145deg,#38bdf8,#67e8f9);box-shadow:0 4px #0e7490;cursor:pointer}
.action:active{transform:translateY(2px);box-shadow:0 1px #0e7490}
.action:disabled{opacity:.3;box-shadow:none}
#reel{display:none;background:linear-gradient(145deg,#86efac,#4ade80);box-shadow:0 4px #166534}
#up,#down{display:none;max-width:52px;background:linear-gradient(145deg,#94a3b8,#475569);box-shadow:0 4px #1e293b}
#continue{display:none;background:linear-gradient(145deg,#fde047,#fb923c);box-shadow:0 4px #9a3412}
#log{max-width:52px;background:linear-gradient(145deg,#64748b,#475569);box-shadow:0 4px #1e293b}
#sound{border:0;background:transparent;color:#bcefff;font-size:1rem;padding:5px}
#volume{width:58px;accent-color:#38bdf8}
.overlay{display:none;position:fixed;z-index:10;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92%,380px);max-height:86dvh;overflow:auto;padding:22px 19px;text-align:center;border:2px solid #67e8f9;border-radius:20px;background:linear-gradient(160deg,#16465c,#071827);box-shadow:0 0 0 100vmax #000b,0 0 40px #38bdf844}
.overlay h2{color:#a5f3fc;margin:0 0 5px}
.bigfish{font-size:3.6rem;margin:8px}
.details{line-height:1.8;color:#d8edf7;font-size:.9rem;margin:10px 0 17px}
.overlay button{width:100%}
#logbox{border-color:#71869a}
#logbox h2{color:#d2e2ee}
@media(max-height:650px){
.tagline{margin-bottom:12px}
.card{padding:8px}
.avatar{width:44px;height:44px}
.cards{gap:7px;margin-bottom:10px}
.panel h1{font-size:2.8rem}
#controls{gap:6px;padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom))}
.action{min-height:43px}
}
</style>
</head>
<body>

<section id="selection">
 <div class="panel">
  <div class="eyebrow">Pacific Northwest • Since sunrise</div>
  <h1>ROSS LAKE</h1>
  <div class="tagline">WILDERNESS FISHING ADVENTURE</div>

  <div class="cards">
   <button class="card" data-name="Clay">
    <span class="avatar clay">C</span>
    <strong>Clay</strong>
    <small>Steady &amp; patient</small>
   </button>
   <button class="card" data-name="Ryan">
    <span class="avatar ryan">R</span>
    <strong>Ryan</strong>
    <small>Fast caster</small>
   </button>
   <button class="card" data-name="Justin">
    <span class="avatar justin">J</span>
    <strong>Justin</strong>
    <small>Lucky angler</small>
   </button>
   <button class="card" data-name="Bob">
    <span class="avatar bob">B</span>
    <strong>Bob</strong>
    <small>Trophy hunter</small>
   </button>
  </div>

  <button id="start" class="primary" disabled>START FISHING</button>
  <div id="selectedInfo">Choose your angler to begin.</div>
 </div>
</section>

<section id="game">
 <header id="top">
  <span id="angler">🎣 Angler</span>
  <span id="place">ROSS LAKE</span>
  <span id="count">Catches: 0</span>
  <button id="sound" aria-label="Toggle sound">🔊</button>
  <input id="volume" aria-label="Volume" type="range" min="0" max="1" step=".05" value=".55">
 </header>

 <div id="status">Tap CAST to send your line into the lake.</div>
 <canvas id="scene" aria-label="Animated fishing lake"></canvas>

 <nav id="controls">
  <button id="up" class="action" aria-label="Raise bait">▲</button>
  <button id="cast" class="action">🎣 CAST</button>
  <button id="down" class="action" aria-label="Lower bait">▼</button>
  <button id="reel" class="action">⬆ HOLD TO REEL</button>
  <button id="continue" class="action">CONTINUE</button>
  <button id="log" class="action">📊</button>
 </nav>
</section>

<div id="catchbox" class="overlay">
 <h2 id="catchTitle">FISH CAUGHT!</h2>
 <div class="bigfish" id="fishEmoji">🐟</div>
 <div class="details" id="catchDetails"></div>
 <button id="keep" class="primary">KEEP FISHING</button>
</div>

<div id="logbox" class="overlay">
 <h2>Fishing Journal</h2>
 <div class="details" id="logDetails"></div>
 <button id="closeLog" class="primary">CLOSE</button>
</div>

<script>
(()=>{
'use strict';

const $=id=>document.getElementById(id);
const selection=$('selection');
const game=$('game');
const canvas=$('scene');
const ctx=canvas.getContext('2d');
const status=$('status');
const castBtn=$('cast');
const reelBtn=$('reel');
const upBtn=$('up');
const downBtn=$('down');
const continueBtn=$('continue');
const catchbox=$('catchbox');
const logbox=$('logbox');

const anglers={
 Clay:{tension:.78,dist:1,luck:1,size:1,label:'Steady & patient'},
 Ryan:{tension:1.02,dist:1.2,luck:1,size:.98,label:'Fast caster'},
 Justin:{tension:1,dist:1,luck:1.45,size:1.03,label:'Lucky angler'},
 Bob:{tension:1.08,dist:1.05,luck:1.08,size:1.22,label:'Trophy hunter'}
};

const species=[
 {name:'Rainbow Trout',color:'#6cae76',belly:'#f3dfc3',min:9,max:23,weight:1.25,rarity:.95,fight:1,emoji:'🐟'},
 {name:'Kokanee Salmon',color:'#d87567',belly:'#f5d8c7',min:9,max:18,weight:1.1,rarity:.66,fight:1.05,emoji:'🐟'},
 {name:'Lake Trout',color:'#607b86',belly:'#d2dfdf',min:15,max:40,weight:1.9,rarity:.38,fight:1.5,emoji:'🐟'},
 {name:'Bull Trout',color:'#527989',belly:'#d8e4e8',min:12,max:32,weight:1.65,rarity:.25,fight:1.55,emoji:'🐟'},
 {name:'Mountain Whitefish',color:'#a3a69a',belly:'#e8e5d8',min:7,max:16,weight:.82,rarity:.58,fight:.72,emoji:'🐟'},
 {name:'Burbot',color:'#8b795e',belly:'#d5c7a9',min:12,max:30,weight:1.6,rarity:.28,fight:1.2,emoji:'🐟'}
];

let player='';
let perk=anglers.Clay;
let w=0,h=0,dpr=1;
let boatX=0,boatY=0,elapsed=0,last=0,raf=0;
let state='idle',hookX=0,hookY=0,targetFish=null;
let fish=[],clouds=[],sparkles=[],particles=[];
let castPower=0,isReeling=false,progress=0,tension=0,stamina=100,perfect=false;
let biteTimer=0,escapeTimer=0,nibbleTimer=0,runTimer=0,runDir=0;
let weather='clear',weatherClock=0,day=.35;
let volume=.55,muted=false,audio=null;
let sessionCatches=0,sessionWeight=0,history=[];
let totals={
 catches:0,
 weight:0,
 best:{name:'None',inches:0,pounds:0},
 history:[]
};

try{
 const saved=JSON.parse(localStorage.getItem('rossLakeStats')||'{}');
 totals={...totals,...saved};
 totals.best=totals.best||{name:'None',inches:0,pounds:0};
}catch(e){}

const rnd=(a,b)=>a+Math.random()*(b-a);

function save(){
 try{
  localStorage.setItem('rossLakeStats',JSON.stringify(totals));
 }catch(e){}
}

function sound(f=440,d=.08,type='sine',v=.07){
 if(muted||!volume)return;
 try{
  audio=audio||new(window.AudioContext||window.webkitAudioContext)();
  const o=audio.createOscillator();
  const g=audio.createGain();
  o.type=type;
  o.frequency.value=f;
  g.gain.value=v*volume;
  g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);
  o.connect(g);
  g.connect(audio.destination);
  o.start();
  o.stop(audio.currentTime+d);
 }catch(e){}
}

function setStatus(s){
 status.textContent=s;
}

document.querySelectorAll('.card').forEach(b=>{
 b.addEventListener('click',()=>{
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('selected',c===b));
  player=b.dataset.name;
  perk=anglers[player];
  $('start').disabled=false;
  $('selectedInfo').textContent=player+' is ready to fish.';
 });
});

$('start').addEventListener('click',()=>{
 if(!player)return;
 sound(520,.08);
 selection.style.display='none';
 game.style.display='flex';
 resize();
 startLoop();
 resetControls();
 setStatus('Tap CAST to cast. Wait for a bite, then hold REEL.');
});

function resize(){
 const r=canvas.getBoundingClientRect();
 if(!r.width||!r.height)return;
 dpr=Math.min(devicePixelRatio||1,2);
 w=r.width;
 h=r.height;
 canvas.width=Math.round(w*dpr);
 canvas.height=Math.round(h*dpr);
 ctx.setTransform(dpr,0,0,dpr,0,0);
 boatX=w*.5;
 boatY=h*.255;
 hookX=boatX+60;
 hookY=h*.62;
 createFish();
 clouds=Array.from({length:7},()=>({
  x:rnd(-30,w),y:rnd(8,h*.14),s:rnd(18,42),v:rnd(2,7)
 }));
 sparkles=Array.from({length:35},()=>({
  x:rnd(0,w),y:rnd(h*.42,h),s:rnd(.6,2.2),p:rnd(0,7)
 }));
}

function createFish(){
 fish=Array.from({length:18},()=>({
  x:rnd(0,w),y:rnd(h*.48,h*.91),
  dir:Math.random()<.5?-1:1,
  speed:rnd(8,24),phase:rnd(0,7),scale:rnd(.55,1),
  type:species[Math.floor(Math.random()*species.length)],
  caught:false,hooked:false
 }));
}

function drawSky(){
 let night=day<.18||day>.85;
 let top=night?'#101a31':day<.3||day>.72?'#f29b77':'#54a5d0';
 let mid=night?'#273d5b':day<.3||day>.72?'#ffd09a':'#b5e2eb';
 let g=ctx.createLinearGradient(0,0,0,h*.48);
 g.addColorStop(0,top);
 g.addColorStop(1,mid);
 ctx.fillStyle=g;
 ctx.fillRect(0,0,w,h);

 const sx=w*.78,sy=h*.1;
 ctx.fillStyle=night?'#e7efff':'#fff4ca';
 ctx.beginPath();
 ctx.arc(sx,sy,night?10:17,0,Math.PI*2);
 ctx.fill();

 clouds.forEach(c=>{
  c.x+=c.v*.009;
  if(c.x>w+80)c.x=-80;
  ctx.fillStyle=night?'#9eafc866':'#ffffff99';
  ctx.beginPath();
  ctx.ellipse(c.x,c.y,c.s,c.s*.3,0,0,Math.PI*2);
  ctx.ellipse(c.x-c.s*.45,c.y+4,c.s*.5,c.s*.24,0,0,Math.PI*2);
  ctx.ellipse(c.x+c.s*.42,c.y+3,c.s*.48,c.s*.23,0,0,Math.PI*2);
  ctx.fill();
 });
}

function mountain(points,color){
 ctx.beginPath();
 ctx.moveTo(0,h*.44);
 points.forEach(p=>ctx.lineTo(w*p[0],h*p[1]));
 ctx.lineTo(w,h*.46);
 ctx.lineTo(0,h*.46);
 ctx.closePath();
 ctx.fillStyle=color;
 ctx.fill();
}

function drawMountains(){
 mountain([
  [0,.3],[.1,.12],[.2,.27],[.33,.055],[.48,.28],
  [.61,.1],[.75,.27],[.87,.13],[1,.3]
 ],'#698a91');

 ctx.fillStyle='#edf7f4';

 [[.33,.055,.045],[.61,.1,.035],[.1,.12,.03],[.87,.13,.025]]
 .forEach(([x,y,s])=>{
  ctx.beginPath();
  ctx.moveTo(w*x,h*y);
  ctx.lineTo(w*(x-s),h*(y+s*1.5));
  ctx.lineTo(w*(x-s*.2),h*(y+s));
  ctx.lineTo(w*x,h*(y+s*1.25));
  ctx.lineTo(w*(x+s*.2),h*(y+s*.9));
  ctx.lineTo(w*(x+s),h*(y+s*1.5));
  ctx.closePath();
  ctx.fill();
 });

 mountain([
  [0,.37],[.12,.25],[.22,.34],[.34,.2],[.49,.36],
  [.63,.23],[.78,.35],[.9,.24],[1,.34]
 ],'#2b5b4b');

 for(let i=0;i<Math.ceil(w/18);i++){
  let x=i*18+5;
  let base=h*(.405+Math.sin(i*1.6)*.009);
  let ht=14+(i%5)*4;
  ctx.fillStyle=['#123e38','#185342','#1c604c'][i%3];
  ctx.beginPath();
  ctx.moveTo(x,base-ht);
  ctx.lineTo(x-ht*.42,base+3);
  ctx.lineTo(x+ht*.42,base+3);
  ctx.closePath();
  ctx.fill();
 }
}

function drawWater(){
 let top=h*.405;
 let g=ctx.createLinearGradient(0,top,0,h);
 g.addColorStop(0,'#48aeb0');
 g.addColorStop(.15,'#167e96');
 g.addColorStop(.52,'#07516f');
 g.addColorStop(1,'#031f36');
 ctx.fillStyle=g;
 ctx.fillRect(0,top,w,h-top);

 for(let i=0;i<13;i++){
  let y=top+8+i*h*.05;
  ctx.strokeStyle=`rgba(207,249,255,${.07+(i%3)*.025})`;
  ctx.lineWidth=1;
  ctx.beginPath();
  for(let x=0;x<w;x+=8){
   let yy=y+Math.sin(x*.025+elapsed*1.2+i)*2.1;
   if(x===0)ctx.moveTo(x,yy);
   else ctx.lineTo(x,yy);
  }
  ctx.stroke();
 }

 sparkles.forEach(s=>{
  ctx.globalAlpha=.15+(.5+.5*Math.sin(elapsed*1.8+s.p))*.38;
  ctx.fillStyle='#e2ffff';
  ctx.fillRect(s.x,s.y,s.s*2.8,1.1);
 });
 ctx.globalAlpha=1;
}

function drawFish(f){
 if(f.caught)return;

 if(f.hooked&&targetFish===f){
  f.x+=(hookX-f.x)*.07;
  f.y+=(hookY-f.y)*.07;
  if(state==='fight'&&runDir){
   f.x+=runDir*1.4;
   hookX+=runDir*.8;
  }
 }else{
  f.x+=f.dir*f.speed*.018;
  f.y+=Math.sin(elapsed+f.phase)*.09;
  if(f.x>w+50)f.x=-50;
  if(f.x< -50)f.x=w+50;
 }

 const s=14*f.scale;
 ctx.save();
 ctx.translate(f.x,f.y);
 ctx.scale(f.dir,1);

 ctx.fillStyle=f.type.color;
 ctx.beginPath();
 ctx.moveTo(-s*.5,0);
 ctx.lineTo(-s*1.3,-s*.48);
 ctx.lineTo(-s*1.05,0);
 ctx.lineTo(-s*1.3,s*.48);
 ctx.closePath();
 ctx.fill();

 let g=ctx.createLinearGradient(0,-s*.4,0,s*.4);
 g.addColorStop(0,'#ffffff88');
 g.addColorStop(.25,f.type.color);
 g.addColorStop(.75,f.type.color);
 g.addColorStop(1,f.type.belly);
 ctx.fillStyle=g;
 ctx.beginPath();
 ctx.ellipse(0,0,s,s*.4,0,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle=f.type.color;
 ctx.beginPath();
 ctx.moveTo(-s*.2,-s*.25);
 ctx.lineTo(s*.1,-s*.6);
 ctx.lineTo(s*.48,-s*.25);
 ctx.closePath();
 ctx.fill();

 ctx.fillStyle='white';
 ctx.beginPath();
 ctx.arc(s*.63,-s*.05,s*.105,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle='#102030';
 ctx.beginPath();
 ctx.arc(s*.66,-s*.05,s*.05,0,Math.PI*2);
 ctx.fill();

 ctx.restore();
}

function drawBoat(){
 let x=boatX,y=boatY+Math.sin(elapsed*1.3)*2;

 ctx.fillStyle='#06283c88';
 ctx.beginPath();
 ctx.ellipse(x,y+29,67,8,0,0,Math.PI*2);
 ctx.fill();

 let g=ctx.createLinearGradient(x,y,x,y+35);
 g.addColorStop(0,'#e6bd86');
 g.addColorStop(.4,'#a86c3c');
 g.addColorStop(1,'#4c2a1b');

 ctx.fillStyle=g;
 ctx.beginPath();
 ctx.moveTo(x-63,y);
 ctx.lineTo(x+63,y);
 ctx.lineTo(x+45,y+25);
 ctx.quadraticCurveTo(x,y+39,x-45,y+25);
 ctx.closePath();
 ctx.fill();

 ctx.strokeStyle='#3d281b';
 ctx.lineWidth=2;
 ctx.stroke();

 ctx.fillStyle=player==='Ryan'?'#087da0':
  player==='Clay'?'#64748b':
  player==='Justin'?'#15803d':'#b45309';

 ctx.beginPath();
 ctx.roundRect(x-12,y-38,24,31,5);
 ctx.fill();

 ctx.fillStyle='#e9b88a';
 ctx.beginPath();
 ctx.ellipse(x,y-53,11,13,0,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle=player==='Bob'||player==='Clay'?'#e5e7eb':'#48372b';
 ctx.beginPath();
 ctx.arc(x,y-58,11,Math.PI,Math.PI*2);
 ctx.fill();

 ctx.beginPath();
 ctx.ellipse(x,y-63,14,4,0,Math.PI,Math.PI*2);
 ctx.fill();

 ctx.strokeStyle='#e7d2a0';
 ctx.lineWidth=2;
 ctx.beginPath();
 ctx.moveTo(x+10,y-25);
 ctx.quadraticCurveTo(x+28,y-64,x+45,y-70);
 ctx.stroke();
}

function drawLine(){
 if(state==='idle'||state==='caught')return;

 let sx=boatX+28;
 let sy=boatY-25;
 let wiggle=state==='fight'
  ?Math.sin(elapsed*16)*(5+tension*.15)
  :state==='bite'
  ?Math.sin(elapsed*20)*7
  :Math.sin(elapsed*3)*2;

 ctx.strokeStyle=tension>75?'#ffb1a8':'#f4ffff';
 ctx.lineWidth=1.4;
 ctx.beginPath();
 ctx.moveTo(sx,sy);
 ctx.quadraticCurveTo((sx+hookX)/2+wiggle,(sy+hookY)/2,hookX,hookY);
 ctx.stroke();

 let bob=hookY-7+(state==='bite'?Math.sin(elapsed*17)*5:Math.sin(elapsed*2)*1.5);
 ctx.fillStyle='#ef4444';
 ctx.beginPath();
 ctx.arc(hookX,bob,5.3,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle='#f8fafc';
 ctx.beginPath();
 ctx.arc(hookX,bob-2.7,2.8,0,Math.PI*2);
 ctx.fill();

 if(state==='bite'){
  for(let i=0;i<3;i++){
   ctx.strokeStyle=`rgba(255,255,255,${.4-i*.1})`;
   ctx.beginPath();
   ctx.ellipse(hookX,hookY,12+i*8,4+i*2,0,0,Math.PI*2);
   ctx.stroke();
  }
 }
}

function splash(x,y,n=14){
 for(let i=0;i<n;i++){
  particles.push({
   x,y,vx:rnd(-90,90),vy:rnd(-140,-20),
   life:rnd(.35,.8),max:.8,size:rnd(1.5,4)
  });
 }
}

function drawParticles(dt){
 particles=particles.filter(p=>p.life>0);
 particles.forEach(p=>{
  p.x+=p.vx*dt;
  p.y+=p.vy*dt;
  p.vy+=200*dt;
  p.life-=dt;
  ctx.globalAlpha=Math.max(0,p.life/p.max);
  ctx.fillStyle='#e7ffff';
  ctx.beginPath();
  ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
  ctx.fill();
 });
 ctx.globalAlpha=1;
}

function drawHUD(){
 if(state!=='fight')return;

 let bw=Math.min(w*.7,270);
 let x=(w-bw)/2;
 let y=12;

 ctx.fillStyle='#071827df';
 ctx.beginPath();
 ctx.roundRect(x-10,y-3,bw+20,82,12);
 ctx.fill();

 ctx.font='bold 9px system-ui';
 ctx.textAlign='center';

 [
  ['PROGRESS',progress,'#4ade80',y+13],
  ['LINE TENSION',tension,'#f59e0b',y+38],
  ['FISH ENERGY',stamina,'#a78bfa',y+63]
 ].forEach(([label,val,col,yy])=>{
  ctx.fillStyle='#e4f5ff';
  ctx.fillText(label,w/2,yy);
  ctx.fillStyle='#263b4b';
  ctx.fillRect(x,yy+4,bw,6);
  ctx.fillStyle=col;
  ctx.fillRect(x,yy+4,bw*Math.max(0,Math.min(1,val/100)),6);
 });

 if(tension>78){
  ctx.fillStyle='#ffb3a8';
  ctx.fillText('EASE OFF — LINE UNDER PRESSURE',w/2,y+96);
 }
}

function render(dt){
 ctx.clearRect(0,0,w,h);
 drawSky();
 drawMountains();
 drawWater();
 fish.forEach(drawFish);
 drawBoat();
 drawLine();
 drawParticles(dt);
 drawHUD();
}

function loop(ts){
 if(game.style.display==='none')return;

 const dt=Math.min(.05,last?(ts-last)/1000:.016);
 last=ts;
 elapsed+=dt;
 day=(day+.000025)%1;
 weatherClock+=dt;

 if(weatherClock>90){
  weatherClock=0;
  weather=['clear','clear','cloudy','rain'][Math.floor(Math.random()*4)];
 }

 if(state==='fight'&&targetFish){
  let strength=targetFish.type.fight*targetFish.scale;

  stamina=Math.max(10,stamina-dt*(2.4+strength));
  tension=Math.max(0,tension-dt*(isReeling?0:24));

  if(isReeling){
   tension+=dt*(10+strength*6)*(1+(100-stamina)/120)*perk.tension;
   progress=Math.min(100,progress+dt*(17+5/strength)*(0.8+stamina/300));
  }else{
   progress=Math.max(0,progress-dt*(1.1+strength));
  }

  runTimer-=dt;

  if(runTimer<=0){
   if(Math.random()<.35+strength*.08){
    runDir=(Math.random()<.5?-1:1)*(1+strength*.4)*(stamina/100);
    tension+=6+strength*5;
    setStatus('The fish is making a run! Ease off the reel to protect your line.');
   }else{
    runDir=0;
   }
   runTimer=rnd(.6,1.5);
  }

  if(tension>=100){
   loseFish('The line snapped! Let tension fall before reeling.');
  }else if(progress>=100){
   landFish();
  }
 }

 render(dt);
 raf=requestAnimationFrame(loop);
}

function startLoop(){
 if(raf)cancelAnimationFrame(raf);
 last=0;
 raf=requestAnimationFrame(loop);
}

function resetControls(){
 state='idle';
 targetFish=null;
 isReeling=false;
 progress=0;
 tension=0;
 stamina=100;

 clearTimeout(biteTimer);
 clearTimeout(nibbleTimer);
 clearTimeout(escapeTimer);

 castBtn.style.display='block';
 castBtn.disabled=false;
 castBtn.textContent='🎣 CAST';

 reelBtn.style.display='none';
 upBtn.style.display='none';
 downBtn.style.display='none';
 continueBtn.style.display='none';
}

function cast(){
 if(state!=='idle')return;

 sound(210,.12,'triangle');
 state='casting';
 castBtn.disabled=true;
 castPower=100;

 hookX=Math.max(w*.16,Math.min(w*.84,boatX+w*rnd(-.23,.23)*perk.dist));
 hookY=h*rnd(.57,.72);

 splash(hookX,hookY,12);
 setStatus('Line cast! Watch the bobber…');

 setTimeout(()=>{
  if(state!=='casting')return;

  state='waiting';
  castBtn.style.display='none';
  upBtn.style.display='block';
  downBtn.style.display='block';

  setStatus('Bait is in the water. A bite could come any moment.');

  const wait=rnd(3500,7600)/perk.luck;

  biteTimer=setTimeout(()=>{
   if(state!=='waiting')return;

   state='nibble';
   setStatus('A fish is investigating your bait…');
   sound(280,.07);

   nibbleTimer=setTimeout(()=>{
    if(state!=='nibble')return;

    const candidates=fish.filter(f=>!f.caught&&!f.hooked);

    if(!candidates.length)createFish();

    const pool=fish.filter(f=>!f.caught&&!f.hooked);

    pool.sort((a,b)=>
     Math.hypot(a.x-hookX,(a.y-hookY)*.7)-
     Math.hypot(b.x-hookX,(b.y-hookY)*.7)
    );

    targetFish=pool[0]||fish[0];

    if(!targetFish)return;

    targetFish.hooked=true;
    targetFish.x=hookX+rnd(-8,8);
    targetFish.y=hookY+4;

    state='bite';
    perfect=true;
    stamina=100;

    splash(hookX,hookY,22);
    sound(380,.09,'square');

    setStatus('FISH ON! Hold REEL now to set the hook!');

    upBtn.style.display='none';
    downBtn.style.display='none';
    reelBtn.style.display='block';

    escapeTimer=setTimeout(()=>{
     if(state==='bite'){
      loseFish('Too slow! The fish escaped. Cast again.');
     }
    },3200);

   },rnd(900,1800));

  },wait);

 },1200);
}

function shiftDepth(amount){
 if(state!=='waiting'&&state!=='nibble')return;

 hookY=Math.max(h*.47,Math.min(h*.89,hookY+amount*h));

 setStatus(amount<0
  ?'You raised the bait a little.'
  :'You dropped the bait deeper.'
 );
}

function beginReel(e){
 e.preventDefault();

 if(state==='bite'){
  clearTimeout(escapeTimer);
  state='fight';
  progress=perfect?24:12;
  tension=perfect?8:14;
  setStatus('Fight the fish! Hold to reel; release to ease line tension.');
 }

 if(state==='fight'){
  isReeling=true;
  sound(150,.04,'triangle',.035);
 }
}

function stopReel(){
 isReeling=false;
}

function landFish(){
 if(state!=='fight'||!targetFish)return;

 state='caught';
 isReeling=false;
 clearTimeout(escapeTimer);

 const f=targetFish;
 f.caught=true;
 f.hooked=false;

 splash(boatX,boatY,28);
 sound(440,.1);
 setTimeout(()=>sound(560,.1),80);
 setTimeout(()=>sound(680,.16),160);

 let inches=Math.round(rnd(f.type.min,f.type.max)*perk.size);
 let pounds=Math.max(.2,Math.pow(inches/12,3)*f.type.weight*rnd(.78,1.2));

 totals.catches++;
 totals.weight+=pounds;
 sessionCatches++;
 sessionWeight+=pounds;

 if(inches>totals.best.inches){
  totals.best={name:f.type.name,inches,pounds};
 }

 let rarity=inches>=28||f.type.rarity<.28
  ?'Legendary'
  :inches>=22||f.type.rarity<.48
  ?'Trophy'
  :f.type.rarity<.7
  ?'Rare'
  :'Common';

 history.unshift({
  name:f.type.name,inches,pounds,rarity
 });

 totals.history=history.concat(totals.history||[]).slice(0,15);
 save();

 $('count').textContent='Catches: '+totals.catches;

 let title=rarity==='Legendary'
  ?'LEGENDARY CATCH!'
  :rarity==='Trophy'
  ?'TROPHY FISH!'
  :'FISH CAUGHT!';

 $('catchTitle').textContent=title;
 $('fishEmoji').textContent=f.type.emoji;

 $('catchDetails').innerHTML=
  '<b>Species:</b> '+f.type.name+
  '<br><b>Length:</b> '+inches+' inches'+
  '<br><b>Estimated weight:</b> '+pounds.toFixed(1)+' lb'+
  '<br><b>Rarity:</b> '+rarity+
  '<br><b>Angler:</b> '+player+' — '+perk.label+
  '<br><b>All-time catches:</b> '+totals.catches+
  '<br><b>Total weight:</b> '+totals.weight.toFixed(1)+' lb';

 catchbox.style.display='block';
 castBtn.style.display='none';
 reelBtn.style.display='none';
 continueBtn.style.display='block';

 setStatus('Nice work! Fish landed.');
}

function loseFish(message){
 clearTimeout(biteTimer);
 clearTimeout(nibbleTimer);
 clearTimeout(escapeTimer);

 if(targetFish)targetFish.hooked=false;

 targetFish=null;
 resetControls();
 setStatus(message);
}

function closeCatch(){
 catchbox.style.display='none';

 if(targetFish){
  targetFish.caught=true;
  targetFish.hooked=false;
 }

 targetFish=null;

 if(fish.filter(f=>!f.caught).length<7){
  createFish();
 }

 resetControls();
 setStatus('Ready for another cast. Tap CAST to fish again.');
}

castBtn.addEventListener('click',cast);

upBtn.addEventListener('click',()=>shiftDepth(-.045));
downBtn.addEventListener('click',()=>shiftDepth(.045));

reelBtn.addEventListener('pointerdown',beginReel);

['pointerup','pointercancel','pointerleave'].forEach(ev=>{
 reelBtn.addEventListener(ev,stopReel);
});

window.addEventListener('pointerup',stopReel);

$('keep').addEventListener('click',closeCatch);
continueBtn.addEventListener('click',closeCatch);

$('log').addEventListener('click',()=>{
 let recent=(totals.history||[]).slice(0,5).map(c=>
  `${c.name}: ${c.inches} in / ${Number(c.pounds).toFixed(1)} lb (${c.rarity})`
 ).join('<br>')||'No fish caught yet.';

 $('logDetails').innerHTML=
  '<b>Total catches:</b> '+totals.catches+
  '<br><b>Total weight:</b> '+Number(totals.weight||0).toFixed(1)+' lb'+
  '<br><b>Personal best:</b> '+totals.best.name+
  '<br>'+(totals.best.inches
   ?totals.best.inches+' in / '+Number(totals.best.pounds).toFixed(1)+' lb'
   :'—')+
  '<br><br><b>Recent catches</b><br>'+recent;

 logbox.style.display='block';
});

$('closeLog').addEventListener('click',()=>{
 logbox.style.display='none';
});

$('volume').addEventListener('input',e=>{
 volume=Number(e.target.value);
 muted=volume===0;
 $('sound').textContent=muted?'🔇':'🔊';
});

$('sound').addEventListener('click',()=>{
 muted=!muted;
 $('sound').textContent=muted?'🔇':'🔊';

 if(!muted&&volume===0){
  volume=.55;
  $('volume').value='.55';
 }
});

window.addEventListener('resize',()=>{
 if(game.style.display==='flex')resize();
});

document.addEventListener('visibilitychange',()=>{
 if(document.hidden)stopReel();
});

$('count').textContent='Catches: '+totals.catches;

})();
</script>
</body>
</html>
