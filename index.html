<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ross Lake Wilderness Fishing</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#031018;color:#f0f9ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none}
#selection-screen{width:100%;height:100dvh;display:flex;justify-content:center;align-items:center;padding:20px 16px;background:radial-gradient(ellipse at 50% 0%,#1a5f7a 0%,transparent 55%),linear-gradient(180deg,#0a2a3d,#031018)}
.container{width:100%;max-width:460px;text-align:center}
.logo{font-size:clamp(2.4rem,9vw,3.8rem);font-weight:950;letter-spacing:3px;color:#f0f9ff;text-shadow:0 4px 0 #0369a1,0 0 40px #38bdf866}
.subtitle{color:#7dd3fc;margin:8px 0 22px;letter-spacing:3px;text-transform:uppercase;font-size:.72rem;font-weight:600}
.characters{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:20px}
.character-card{color:white;font:inherit;appearance:none;background:linear-gradient(160deg,#14384e,#0a1f2e);border:2px solid #2a4d66;border-radius:18px;padding:13px 8px;cursor:pointer;transition:.2s}
.character-card.selected{border-color:#38bdf8;background:linear-gradient(160deg,#155a75,#0d2f42);box-shadow:0 0 28px #38bdf844;transform:translateY(-3px)}
.avatar{width:62px;height:62px;border-radius:50%;margin:0 auto 7px;display:flex;align-items:center;justify-content:center;font-size:1.65rem;font-weight:900;border:3px solid rgba(255,255,255,.2)}
.clay{background:linear-gradient(145deg,#94a3b8,#475569)}.ryan{background:linear-gradient(145deg,#38bdf8,#0369a1)}.justin{background:linear-gradient(145deg,#4ade80,#166534)}.bob{background:linear-gradient(145deg,#fbbf24,#b45309)}
.name{display:block;font-size:1.05rem;font-weight:800}
.flavor{display:block;font-size:.63rem;color:#94a3b8;margin-top:2px}
#startBtn{width:100%;max-width:280px;border:none;border-radius:50px;padding:14px;font-size:1.05rem;font-weight:900;background:linear-gradient(90deg,#38bdf8,#67e8f9);color:#062033;opacity:.35;cursor:not-allowed;box-shadow:0 5px 0 #0e7490}
#startBtn.active{opacity:1;cursor:pointer}
#selectedInfo{color:#bae6fd;margin-top:13px;font-size:.88rem}

#game-screen{display:none;flex-direction:column;height:100dvh;width:100%;background:#031018}
#top-bar{flex-shrink:0;min-height:46px;display:flex;align-items:center;justify-content:space-between;padding:7px 12px;background:linear-gradient(180deg,#0a1c2b,#06131e);border-bottom:1px solid #1e3a4f}
#player-name{color:#7dd3fc;font-weight:800;font-size:.84rem}
#location-name{font-weight:900;letter-spacing:1px;font-size:.88rem}
#fish-counter{color:#a5f3fc;font-size:.74rem;font-weight:700}
#status{flex-shrink:0;min-height:38px;display:flex;justify-content:center;align-items:center;padding:5px 10px;text-align:center;background:#0c2233;color:#e0f2fe;font-size:.83rem;font-weight:600;border-bottom:1px solid #1a3348}
#gameCanvas{display:block;width:100%;flex:1;min-height:0;background:#0c4a6e}
#controls{flex-shrink:0;display:flex;justify-content:center;align-items:center;gap:7px;padding:9px;padding-bottom:calc(9px + env(safe-area-inset-bottom));background:#06131e;border-top:1px solid #1e3a4f;flex-wrap:wrap}
.game-btn{flex:1;min-width:66px;max-width:150px;min-height:48px;border:none;border-radius:13px;padding:10px 6px;font-size:.88rem;font-weight:950;background:linear-gradient(145deg,#38bdf8,#22d3ee);color:#052033;cursor:pointer;box-shadow:0 4px 0 #0e7490}
.game-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0e7490}
.game-btn:disabled{opacity:.28;box-shadow:none}
#reelBtn{display:none;background:linear-gradient(145deg,#4ade80,#a3e635);box-shadow:0 4px 0 #166534}
#releaseBtn{display:none;background:linear-gradient(145deg,#fbbf24,#fb923c);box-shadow:0 4px 0 #9a3412}
#depthUp,#depthDown{display:none;max-width:54px;background:linear-gradient(145deg,#64748b,#475569);box-shadow:0 4px 0 #1e293b;font-size:1.05rem}

#volume-control{display:flex;align-items:center;gap:4px;font-size:.7rem;color:#a5f3fc}
#volume-control input{width:60px;accent-color:#38bdf8}
#muteBtn{background:none;border:none;color:#a5f3fc;font-size:1rem;cursor:pointer;padding:2px}

#logBtn{flex:0 0 auto;max-width:50px;background:linear-gradient(145deg,#64748b,#475569);box-shadow:0 4px 0 #1e293b;font-size:.78rem}

#catch-card{display:none;position:fixed;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92%,370px);max-height:88dvh;overflow-y:auto;padding:24px 20px;border:2px solid #67e8f9;border-radius:20px;text-align:center;background:linear-gradient(160deg,#123c53,#071827);box-shadow:0 0 0 100vmax #000a,0 0 50px #38bdf866}
#catch-card h2{font-size:1.45rem;margin-bottom:4px;color:#a5f3fc}
#catch-emoji{font-size:3.6rem;margin:8px 0}
#catch-details{color:#dbeafe;line-height:1.7;margin:10px 0 16px;font-size:.88rem}
#catch-card button{width:100%;border:none;padding:13px;border-radius:12px;font-size:1rem;font-weight:900;background:linear-gradient(90deg,#38bdf8,#67e8f9);color:#082f49;cursor:pointer;box-shadow:0 3px 0 #0e7490}

#log-modal{display:none;position:fixed;z-index:25;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92%,340px);padding:20px;border:2px solid #64748b;border-radius:16px;background:linear-gradient(160deg,#1e293b,#0f172a);box-shadow:0 0 0 100vmax #000a;text-align:center}
#log-modal h3{color:#94a3b8;margin-bottom:10px}
#log-content{color:#e2e8f0;line-height:1.75;font-size:.88rem;margin-bottom:14px}
#log-modal button{width:100%;border:none;padding:10px;border-radius:10px;font-weight:800;background:#475569;color:#f1f5f9;cursor:pointer}
</style>
</head>
<body>

<div id="selection-screen">
  <div class="container">
    <div class="logo">ROSS LAKE</div>
    <div class="subtitle">Wilderness Fishing Adventure</div>
    <div class="characters">
      <button class="character-card" data-name="Clay"><span class="avatar clay">C</span><span class="name">Clay</span><span class="flavor">Steady & patient</span></button>
      <button class="character-card" data-name="Ryan"><span class="avatar ryan">R</span><span class="name">Ryan</span><span class="flavor">Fast caster</span></button>
      <button class="character-card" data-name="Justin"><span class="avatar justin">J</span><span class="name">Justin</span><span class="flavor">Lucky angler</span></button>
      <button class="character-card" data-name="Bob"><span class="avatar bob">B</span><span class="name">Bob</span><span class="flavor">Trophy hunter</span></button>
    </div>
    <button id="startBtn" disabled>START FISHING</button>
    <div id="selectedInfo">Choose your angler to begin.</div>
  </div>
</div>

<div id="game-screen">
  <div id="top-bar">
    <div id="player-name">Angler</div>
    <div id="location-name">ROSS LAKE</div>
    <div id="volume-control">
      <button id="muteBtn" title="Mute">🔊</button>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.7">
    </div>
    <div id="fish-counter">Catches: 0</div>
  </div>
  <div id="status">Hold CAST, drag to aim, release to cast</div>
  <canvas id="gameCanvas"></canvas>
  <div id="controls">
    <button id="depthUp" class="game-btn">▲</button>
    <button id="castBtn" class="game-btn">🎣 CAST</button>
    <button id="depthDown" class="game-btn">▼</button>
    <button id="reelBtn" class="game-btn">⬆ REEL</button>
    <button id="releaseBtn" class="game-btn">CONTINUE</button>
    <button id="logBtn" class="game-btn">📊</button>
  </div>
</div>

<div id="catch-card">
  <h2 id="catch-title">FISH CAUGHT!</h2>
  <div id="catch-emoji">🐟</div>
  <div id="catch-details"></div>
  <button id="keepFishingBtn">KEEP FISHING</button>
</div>

<div id="log-modal">
  <h3>Session Stats</h3>
  <div id="log-content"></div>
  <button id="closeLogBtn">CLOSE</button>
</div>

<script>
(function(){
const $ = id => document.getElementById(id);
const selectionScreen = $("selection-screen");
const gameScreen = $("game-screen");
const startBtn = $("startBtn");
const selectedInfo = $("selectedInfo");
const playerNameEl = $("player-name");
const fishCounter = $("fish-counter");
const statusText = $("status");
const castBtn = $("castBtn");
const reelBtn = $("reelBtn");
const releaseBtn = $("releaseBtn");
const depthUp = $("depthUp");
const depthDown = $("depthDown");
const logBtn = $("logBtn");
const catchCard = $("catch-card");
const catchEmoji = $("catch-emoji");
const catchDetails = $("catch-details");
const keepFishingBtn = $("keepFishingBtn");
const logModal = $("log-modal");
const logContent = $("log-content");
const closeLogBtn = $("closeLogBtn");
const canvas = $("gameCanvas");
const ctx = canvas.getContext("2d");
const cards = [...document.querySelectorAll(".character-card")];

let selectedPlayer = null;
let audioCtx = null;

// Angler bonuses
const anglerStats = {
  Clay:   { tensionMul: 0.78, castSpeed: 1.0,  castDist: 1.0,  luck: 1.0,  sizeMul: 1.0,  label: "Steady" },
  Ryan:   { tensionMul: 1.05, castSpeed: 1.55, castDist: 1.22, luck: 0.95, sizeMul: 0.98, label: "Fast Caster" },
  Justin: { tensionMul: 1.0,  castSpeed: 1.05, castDist: 1.0,  luck: 1.45, sizeMul: 1.05, label: "Lucky" },
  Bob:    { tensionMul: 1.08, castSpeed: 0.95, castDist: 1.05, luck: 1.1,  sizeMul: 1.28, label: "Trophy" }
};

const species = [
  {name:"Rainbow Trout",color:"#5a9e6a",belly:"#e8d8b8",size:1.00,min:9,max:23,weight:1.30,rarity:1.00,emoji:"🐟",fight:1.0,style:"surface"},
  {name:"Eastern Brook Trout",color:"#6b8e23",belly:"#f0e68c",size:1.05,min:8,max:20,weight:1.20,rarity:0.90,emoji:"🐟",fight:1.05,style:"surface"},
  {name:"Brown Trout",color:"#8b5e3c",belly:"#e5c9a5",size:1.08,min:10,max:28,weight:1.45,rarity:0.85,emoji:"🐟",fight:1.15,style:"surface"},
  {name:"Lake Trout",color:"#5a7078",belly:"#c5d4d4",size:1.50,min:15,max:40,weight:1.90,rarity:0.38,emoji:"🐟",fight:1.50,style:"deep"},
  {name:"Kokanee Salmon",color:"#e07060",belly:"#f4d6c6",size:1.05,min:9,max:18,weight:1.15,rarity:0.62,emoji:"🐟",fight:0.95,style:"fast"},
  {name:"Bull Trout",color:"#4a6a7a",belly:"#d7e0e5",size:1.30,min:12,max:32,weight:1.70,rarity:0.24,emoji:"🐟",fight:1.60,style:"deep"},
  {name:"Mountain Whitefish",color:"#9a9d90",belly:"#e4e2d5",size:0.82,min:7,max:16,weight:0.85,rarity:0.55,emoji:"🐟",fight:0.75,style:"gentle"}
];

let width=0,height=0,dpr=1;
let fish=[],particles=[],clouds=[],birds=[],sparkles=[],trees=[];
let boatX=0,boatY=0;
let state="idle";
let hookX=0,hookY=0,targetDepth=0,aimOffset=0;
let targetFish=null;
let biteTimer=null,escapeTimer=null,nibbleTimer=null;
let reelProgress=0,tension=0,castPower=0,charging=false,isReeling=false;
let fishStamina=100,fishRunDir=0,runTimer=0,bitePhase="none";
let catches=0,totalWeight=0;
let bestFish={name:"None",inches:0,pounds:0};
let catchHistory = [];
let pointerStartX=0;
let volume = 0.7;
let muted = false;
let timeOfDay = 0.35; // 0=midnight, 0.25=dawn, 0.5=noon, 0.75=dusk
let weather = "clear"; // clear, cloudy, rain
let weatherTimer = 0;
let rainParticles = [];
let perfectHookWindow = false;
let hookWindowTimer = 0;
let stats = anglerStats.Clay;

try{
  const s=JSON.parse(localStorage.getItem("rossLakeStats")||"{}");
  if(s.totalCatches) catches=s.totalCatches;
  if(s.totalWeight) totalWeight=s.totalWeight;
  if(s.bestFish) bestFish=s.bestFish;
}catch(e){}
function saveStats(){try{localStorage.setItem("rossLakeStats",JSON.stringify({totalCatches:catches,totalWeight,bestFish,catchHistory:catchHistory.slice(-10)}));}catch(e){}}
function loadStats(){
  try{
    const s=JSON.parse(localStorage.getItem("rossLakeStats")||"{}");
    if(s.totalCatches) catches=s.totalCatches;
    if(s.totalWeight) totalWeight=s.totalWeight;
    if(s.bestFish) bestFish=s.bestFish;
    if(s.catchHistory) catchHistory=s.catchHistory;
  }catch(e){}
}
loadStats();

function initAudio(){if(audioCtx)return;try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
function playTone(f,d,t="sine",v=0.12){
  if(!audioCtx || muted)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=t;o.frequency.value=f;
  const vol = v * volume;
  g.gain.setValueAtTime(vol,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+d);
  o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d);
}
function sfxCast(){playTone(200,0.09,"triangle",0.1);setTimeout(()=>playTone(150,0.14,"sine",0.06),60);}
function sfxSplash(){playTone(100,0.2,"sawtooth",0.08);playTone(70,0.25,"triangle",0.06);}
function sfxNibble(){playTone(280,0.05,"sine",0.07);}
function sfxBite(){playTone(340,0.07,"square",0.12);setTimeout(()=>playTone(480,0.08,"square",0.08),50);}
function sfxReel(){playTone(140+Math.random()*40,0.04,"triangle",0.05);}
function sfxSuccess(){playTone(440,0.09,"sine",0.1);setTimeout(()=>playTone(554,0.09,"sine",0.1),80);setTimeout(()=>playTone(659,0.2,"sine",0.1),160);}
function sfxSnap(){playTone(170,0.14,"sawtooth",0.11);playTone(80,0.22,"triangle",0.09);}
function sfxEscape(){playTone(180,0.16,"sawtooth",0.08);playTone(120,0.2,"triangle",0.06);}

cards.forEach(c=>{
  c.addEventListener("click",()=>{
    cards.forEach(o=>o.classList.toggle("selected",o===c));
    selectedPlayer=c.dataset.name;
    selectedInfo.textContent=selectedPlayer+" is ready!";
    startBtn.disabled=false;startBtn.classList.add("active");
  });
});
startBtn.addEventListener("click",()=>{
  if(!selectedPlayer)return;
  initAudio();
  stats = anglerStats[selectedPlayer] || anglerStats.Clay;
  selectionScreen.style.display="none";
  gameScreen.style.display="flex";
  playerNameEl.textContent="🎣 "+selectedPlayer;
  startGame();
});

function resize(){
  const r=canvas.getBoundingClientRect();
  if(r.width<1||r.height<1)return;
  dpr=Math.min(window.devicePixelRatio||1,2);
  width=r.width;height=r.height;
  canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  boatX=width*0.5;boatY=height*0.255;
  hookX=boatX+38;
  createFish();createClouds();createBirds();createSparkles();createTrees();
}

function createFish(){
  fish=[];
  for(let i=0;i<16;i++){
    const t=species[Math.floor(Math.random()*species.length)];
    fish.push({x:Math.random()*width,y:height*(0.50+Math.random()*0.44),speed:10+Math.random()*22,direction:Math.random()<0.5?-1:1,type:t,phase:Math.random()*Math.PI*2,scale:0.55+Math.random()*0.5,caught:false,hooked:false});
  }
}
function createClouds(){clouds=[];for(let i=0;i<7;i++)clouds.push({x:Math.random()*(width+200)-100,y:6+Math.random()*height*0.12,size:16+Math.random()*28,speed:1+Math.random()*3.6,opacity:0.22+Math.random()*0.38});}
function createBirds(){birds=[];for(let i=0;i<5;i++)birds.push({x:Math.random()*width,y:12+Math.random()*height*0.15,speed:13+Math.random()*26,wing:Math.random()*Math.PI*2,dir:Math.random()<0.5?1:-1});}
function createSparkles(){sparkles=[];for(let i=0;i<22;i++)sparkles.push({x:Math.random()*width,y:height*(0.40+Math.random()*0.14),size:1+Math.random()*2.6,phase:Math.random()*Math.PI*2,speed:0.5+Math.random()*1.5});}
function createTrees(){
  trees=[];
  for(let i=0;i<32;i++){
    const x = (i/31)*width + (Math.random()-0.5)*18;
    trees.push({x, baseY: height*0.38 + Math.sin(i*1.7)*height*0.012, h: 18 + (i%6)*5 + Math.random()*8, shade: i%3});
  }
}

function drawSky(){
  // Day/night cycle colors
  let skyTop, skyMid, skyBot, sunCol;
  if(timeOfDay < 0.2 || timeOfDay > 0.85){ // night
    skyTop="#0a0e1a"; skyMid="#1a1f3a"; skyBot="#2a2040"; sunCol="#e0e0ff";
  } else if(timeOfDay < 0.3 || timeOfDay > 0.7){ // dawn/dusk
    skyTop="#ff7e5f"; skyMid="#feb47b"; skyBot="#ffd194"; sunCol="#ffaa44";
  } else { // day
    skyTop="#3b8ec8"; skyMid="#7ec8e8"; skyBot="#c5e8f0"; sunCol="#fff8d0";
  }
  if(weather === "cloudy" || weather === "rain"){
    skyTop = skyTop.replace(/#/, "#") ; // darken slightly
    skyMid="#5a6a7a"; skyBot="#3a4a5a";
  }  const g=ctx.createLinearGradient(0,0,0,height*0.44);
  g.addColorStop(0,skyTop);
  g.addColorStop(0.35,skyMid);
  g.addColorStop(0.7,skyBot);
  g.addColorStop(1,"#e8f4e8");
  ctx.fillStyle=g;ctx.fillRect(0,0,width,height);

  // Stars at night
  if(timeOfDay < 0.2 || timeOfDay > 0.85){
    ctx.fillStyle="#ffffffaa";
    for(let i=0;i<40;i++){
      const sx = (i*137.5)%width, sy=(i*89.3)%(height*0.35);
      ctx.beginPath(); ctx.arc(sx,sy,Math.sin(elapsed*2+i)*0.6+1.2,0,Math.PI*2); ctx.fill();
    }
  }

  // sun
  const sx=width*0.78,sy=height*0.08;
  const glow=ctx.createRadialGradient(sx,sy,2,sx,sy,Math.min(width*0.26,120));
  glow.addColorStop(0,"rgba(255,250,210,0.95)");
  glow.addColorStop(0.25,"rgba(255,240,160,0.35)");
  glow.addColorStop(1,"rgba(255,240,160,0)");
  ctx.fillStyle=glow;ctx.fillRect(sx-130,sy-130,260,260);
  ctx.fillStyle="#fff8d0";ctx.beginPath();ctx.arc(sx,sy,17,0,Math.PI*2);ctx.fill();

  // clouds
  clouds.forEach(c=>{
    c.x+=c.speed*0.012;
    if(c.x>width+110)c.x=-110;
    ctx.globalAlpha=c.opacity;
    ctx.fillStyle="#fff";
    ctx.beginPath();
    ctx.ellipse(c.x,c.y,c.size,c.size*0.34,0,0,Math.PI*2);
    ctx.ellipse(c.x-c.size*0.48,c.y+3,c.size*0.52,c.size*0.28,0,0,Math.PI*2);
    ctx.ellipse(c.x+c.size*0.44,c.y+2,c.size*0.48,c.size*0.26,0,0,Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha=1;

  // birds
  birds.forEach(b=>{
    b.x+=b.speed*b.dir*0.017;
    b.wing+=0.18;
    if(b.x>width+40){b.x=-40;b.y=12+Math.random()*height*0.14;}
    if(b.x<-40){b.x=width+40;b.y=12+Math.random()*height*0.14;}
    const f=Math.sin(b.wing)*5;
    ctx.strokeStyle="#1e293b";ctx.lineWidth=1.7;
    ctx.beginPath();ctx.moveTo(b.x-7*b.dir,b.y+f);ctx.quadraticCurveTo(b.x,b.y-4,b.x+7*b.dir,b.y+f);ctx.stroke();
  });
}

function drawMountain(pts,col,yb){
  ctx.beginPath();
  ctx.moveTo(0,height*yb);
  pts.forEach(p=>ctx.lineTo(width*p[0],height*p[1]));
  ctx.lineTo(width,height*(yb+0.04));
  ctx.lineTo(width,height*0.46);
  ctx.lineTo(0,height*0.46);
  ctx.closePath();
  ctx.fillStyle=col;ctx.fill();
}

function drawMountains(){
  // far range
  drawMountain([[0,.27],[.11,.11],[.19,.23],[.32,.05],[.46,.25],[.59,.08],[.73,.24],[.86,.12],[1,.28]],"#6b8a92",.32);
  // snow
  ctx.fillStyle="#eef6f4";
  [[.32,.05,.048],[.59,.08,.04],[.11,.11,.036],[.86,.12,.03]].forEach(([x,y,s])=>{
    ctx.beginPath();
    ctx.moveTo(width*x,height*y);
    ctx.lineTo(width*(x-s),height*(y+s*1.55));
    ctx.lineTo(width*(x-s*.2),height*(y+s));
    ctx.lineTo(width*x,height*(y+s*1.25));
    ctx.lineTo(width*(x+s*.18),height*(y+s*.85));
    ctx.lineTo(width*(x+s),height*(y+s*1.55));
    ctx.closePath();ctx.fill();
  });
  // mid range
  drawMountain([[0,.35],[.08,.25],[.17,.33],[.29,.19],[.41,.34],[.56,.23],[.70,.34],[.84,.22],[1,.33]],"#2a5349",.35);

  // shoreline trees
  trees.forEach(t=>{
    const col = t.shade===0 ? "#0f3d36" : (t.shade===1 ? "#145043" : "#1a5c4a");
    ctx.fillStyle=col;
    ctx.beginPath();
    ctx.moveTo(t.x, t.baseY - t.h);
    ctx.lineTo(t.x - t.h*0.42, t.baseY + t.h*0.15);
    ctx.lineTo(t.x + t.h*0.42, t.baseY + t.h*0.15);
    ctx.closePath();
    ctx.fill();
    // trunk
    ctx.fillStyle="#3d2b1f";
    ctx.fillRect(t.x-1.5, t.baseY + t.h*0.05, 3, t.h*0.18);
  });
}

function drawWater(){
  const top = height * 0.39;
  const g = ctx.createLinearGradient(0, top, 0, height);
  g.addColorStop(0, "#3aa0a8");
  g.addColorStop(0.12, "#1a7f96");
  g.addColorStop(0.4, "#0a5c7a");
  g.addColorStop(0.72, "#043a55");
  g.addColorStop(1, "#021e30");
  ctx.fillStyle = g;
  ctx.fillRect(0, top, width, height - top);

  // sparkles
  sparkles.forEach(s=>{
    s.phase += s.speed * 0.036;
    ctx.globalAlpha = Math.max(0, 0.16 + Math.sin(s.phase) * 0.36);
    ctx.fillStyle = "#e0f7fa";
    ctx.beginPath();
    ctx.arc(s.x, s.y + Math.sin(elapsed*1.4 + s.phase)*1.4, s.size, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // wave lines
  for(let i=0;i<8;i++){
    ctx.beginPath();
    const y = top + 5 + i * height * 0.065;
    for(let x=0;x<=width;x+=9){
      const wy = y + Math.sin(x*0.019 + elapsed*1.4 + i*0.7)*(2.2 + i*0.14);
      x===0 ? ctx.moveTo(x,wy) : ctx.lineTo(x,wy);
    }
    ctx.strokeStyle = `rgba(180,240,250,${0.05 + i*0.009})`;
    ctx.lineWidth = 1.3;
    ctx.stroke();
  }

  // foam near boat
  ctx.fillStyle = "rgba(220,245,250,0.12)";
  ctx.beginPath();
  ctx.ellipse(boatX, boatY + 32, 70, 9, 0, 0, Math.PI*2);
  ctx.fill();
}

function drawOneFish(f,t){
  const size = f.type.size * f.scale * 14.5;
  const facing = f.direction;
  ctx.save();
  ctx.translate(f.x, f.y);
  ctx.scale(facing, 1);
  const w = Math.sin(t*7.5 + f.phase) * size * 0.17;

  // tail
  ctx.fillStyle = f.type.color;
  ctx.beginPath();
  ctx.moveTo(-size*0.5, 0);
  ctx.lineTo(-size*1.25, -size*0.48 + w);
  ctx.lineTo(-size*1.02, w*0.3);
  ctx.lineTo(-size*1.25, size*0.48 + w);
  ctx.closePath();
  ctx.fill();

  // body
  const bg = ctx.createLinearGradient(0, -size*0.42, 0, size*0.42);
  bg.addColorStop(0, "#ffffffaa");
  bg.addColorStop(0.14, f.type.color);
  bg.addColorStop(0.65, f.type.color);
  bg.addColorStop(1, f.type.belly);
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.ellipse(0, 0, size, size*0.4, 0, 0, Math.PI*2);
  ctx.fill();

  // dorsal
  ctx.fillStyle = f.type.color;
  ctx.beginPath();
  ctx.moveTo(-size*0.18, -size*0.26);
  ctx.lineTo(size*0.14, -size*0.62);
  ctx.lineTo(size*0.48, -size*0.25);
  ctx.closePath();
  ctx.fill();

  // eye
  ctx.fillStyle = "#f8fafc";
  ctx.beginPath();
  ctx.arc(size*0.62, -size*0.05, size*0.1, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = "#0f172a";
  ctx.beginPath();
  ctx.arc(size*0.65, -size*0.05, size*0.05, 0, Math.PI*2);
  ctx.fill();

  ctx.restore();
}

function drawFish(){
  fish.forEach(f=>{
    if(f.caught) return;
    if(f.hooked && targetFish === f){
      f.x += (hookX - f.x) * 0.055;
      f.y += (hookY - f.y) * 0.055;
      if(state === "fighting" && fishRunDir){
        f.x += fishRunDir * 1.7;
        hookX += fishRunDir * 0.95;
      }
    } else if((state === "waiting" || state === "nibble") && !f.hooked){
      const dx = hookX - f.x, dy = hookY - f.y, d = Math.hypot(dx,dy);
      if(d < 140 && Math.random() < 0.028){
        f.x += Math.sign(dx) * 1.6;
        f.y += Math.sign(dy) * 0.7;
      } else {
        f.x += f.direction * f.speed * 0.021;
        f.y += Math.sin(elapsed * 1.1 + f.phase) * 0.13;
      }
    } else {
      f.x += f.direction * f.speed * 0.021;
      f.y += Math.sin(elapsed * 1.1 + f.phase) * 0.13;
    }
    if(f.x > width + 65) f.x = -65;
    if(f.x < -65) f.x = width + 65;
    if(!f.hooked && Math.random() < 0.0032) f.direction *= -1;
    drawOneFish(f, elapsed);
  });
}

function drawBoat(){
  const x = boatX, y = boatY + Math.sin(elapsed * 1.3) * 1.9;

  // shadow
  ctx.fillStyle = "rgba(5,40,60,0.42)";
  ctx.beginPath();
  ctx.ellipse(x, y + 31, 68, 9, 0, 0, Math.PI*2);
  ctx.fill();

  // hull
  const hull = ctx.createLinearGradient(x, y-2, x, y+35);
  hull.addColorStop(0, "#e0b07a");
  hull.addColorStop(0.35, "#a86b3c");
  hull.addColorStop(1, "#5c3018");
  ctx.fillStyle = hull;
  ctx.beginPath();
  ctx.moveTo(x-64, y);
  ctx.lineTo(x+64, y);
  ctx.lineTo(x+46, y+27);
  ctx.quadraticCurveTo(x, y+40, x-46, y+27);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = "#3d2010";
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // angler
  const shirt = selectedPlayer === "Ryan" ? "#0e7490" :
                selectedPlayer === "Clay" ? "#64748b" :
                selectedPlayer === "Justin" ? "#15803d" : "#b45309";
  ctx.fillStyle = shirt;
  ctx.beginPath();
  ctx.roundRect(x-12, y-37, 24, 31, 6);
  ctx.fill();

  // arm / rod
  ctx.strokeStyle = "#d4a06a";
  ctx.lineWidth = 5.5;
  ctx.beginPath();
  ctx.moveTo(x-9, y-30);
  ctx.lineTo(x+13, y-19);
  ctx.lineTo(x+29, y-23);
  ctx.stroke();

  // head
  ctx.fillStyle = "#e8b888";
  ctx.beginPath();
  ctx.ellipse(x, y-54, 11.5, 14, 0, 0, Math.PI*2);
  ctx.fill();

  // hat
  ctx.fillStyle = (selectedPlayer === "Bob" || selectedPlayer === "Clay") ? "#e5e7eb" : "#3d2e24";
  ctx.beginPath();
  ctx.arc(x, y-59, 11.5, Math.PI, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = "#14532d";
  ctx.beginPath();
  ctx.ellipse(x, y-64, 13.5, 4.6, 0, Math.PI, Math.PI*2);
  ctx.fill();

  // rod tip
  ctx.strokeStyle = "#e8c98a";
  ctx.lineWidth = 2.2;
  ctx.beginPath();  ctx.moveTo(x+13, y-23);
  ctx.quadraticCurveTo(x+25, y-62, x+44, y-68);
  ctx.stroke();
}

function drawFishingLine(){
  if(state === "idle" || state === "caught") return;
  const sx = boatX + 27, sy = boatY - 23;
  let wiggle = 4;
  if(state === "fighting") wiggle = Math.sin(elapsed * 16) * (5 + tension * 0.17);
  else if(state === "biting") wiggle = Math.sin(elapsed * 21) * 7.5;
  else if(state === "nibble") wiggle = Math.sin(elapsed * 10) * 3.2;

  ctx.strokeStyle = tension > 72 ? "#fca5a5" : "#f1f5f9";
  ctx.lineWidth = tension > 72 ? 2.1 : 1.45;
  ctx.beginPath();
  ctx.moveTo(sx, sy);
  ctx.quadraticCurveTo((sx + hookX)/2 + wiggle, (sy + hookY)/2, hookX, hookY);
  ctx.stroke();

  // bobber
  let bobOffset = 0;
  if(state === "nibble") bobOffset = Math.sin(elapsed * 12) * 3.8;
  else if(state === "biting") bobOffset = Math.sin(elapsed * 18) * 5.5;
  else if(state === "waiting") bobOffset = Math.sin(elapsed * 2.3) * 1.3;

  const bobY = hookY - 8 + bobOffset;
  ctx.fillStyle = "#ef4444";
  ctx.beginPath();
  ctx.arc(hookX, bobY, 5.2, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = "#f8fafc";
  ctx.beginPath();
  ctx.arc(hookX, bobY - 2.9, 2.9, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = "#cbd5e1";
  ctx.lineWidth = 1.9;
  ctx.beginPath();
  ctx.moveTo(hookX, bobY + 2);
  ctx.lineTo(hookX, hookY + 5);
  ctx.arc(hookX + 3.6, hookY + 5, 3.6, Math.PI, Math.PI * 1.7);
  ctx.stroke();

  if(state === "biting"){
    for(let i=0;i<3;i++){
      ctx.beginPath();
      ctx.ellipse(hookX, hookY, 10 + i*6.5 + Math.sin(elapsed*14)*2.2, 3.5 + i*2.2, 0, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(255,255,255,${0.42 - i*0.11})`;
      ctx.lineWidth = 1.4;
      ctx.stroke();
    }
  }
}

function createSplash(x,y,n=18){
  for(let i=0;i<n;i++){
    particles.push({
      x, y,
      vx: (Math.random()-0.5)*170,
      vy: -Math.random()*160 - 18,
      life: 0.4 + Math.random()*0.65,
      maxLife: 1.15,
      size: 1.7 + Math.random()*4.2
    });
  }
}

function drawParticles(dt){
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p=>{
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 220 * dt;
    p.life -= dt;
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = "#dffbff";
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}


function drawRain(){
  if(weather !== "rain") return;
  ctx.strokeStyle="rgba(180,220,255,0.35)";
  ctx.lineWidth=1;
  rainParticles.forEach(p=>{
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x+1.5, p.y+8);
    ctx.stroke();
    p.y += p.speed;
    p.x += 0.4;
    if(p.y > height*0.9){ p.y = Math.random()*height*0.3; p.x = Math.random()*width; }
  });
}

function drawHUD(){
  if(charging){
    const bw = Math.min(width*0.54, 230), x = (width-bw)/2, y = height*0.072;
    ctx.fillStyle = "rgba(7,24,39,0.84)";
    ctx.beginPath(); ctx.roundRect(x-9, y-21, bw+18, 46, 10); ctx.fill();
    ctx.fillStyle = "#94a3b8";
    ctx.font = "bold 9px system-ui";
    ctx.textAlign = "center";
    ctx.fillText("CAST POWER  •  drag to aim", width/2, y-7);
    ctx.fillStyle = "#1e293b";
    ctx.beginPath(); ctx.roundRect(x, y, bw, 11, 5); ctx.fill();
    const pct = Math.min(1, castPower/100);
    const g = ctx.createLinearGradient(x,0,x+bw,0);
    g.addColorStop(0,"#38bdf8"); g.addColorStop(0.7,"#22d3ee"); g.addColorStop(1,"#fbbf24");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.roundRect(x, y, bw*pct, 11, 5); ctx.fill();
  }

  if(state === "fighting"){
    const bw = Math.min(width*0.68, 280), x = (width-bw)/2, y = height*0.06;
    ctx.fillStyle = "rgba(7,24,39,0.9)";
    ctx.beginPath(); ctx.roundRect(x-11, y-25, bw+22, 96, 12); ctx.fill();

    ctx.fillStyle = "#e2e8f0"; ctx.font = "bold 9px system-ui"; ctx.textAlign = "center";
    ctx.fillText("PROGRESS", width/2, y-9);
    ctx.fillStyle = "#1e293b"; ctx.beginPath(); ctx.roundRect(x,y,bw,10,5); ctx.fill();
    ctx.fillStyle = "#22c55e"; ctx.beginPath(); ctx.roundRect(x,y,bw*Math.min(1,reelProgress/100),10,5); ctx.fill();

    ctx.fillStyle = "#e2e8f0"; ctx.fillText("TENSION", width/2, y+25);
    ctx.fillStyle = "#1e293b"; ctx.beginPath(); ctx.roundRect(x,y+29,bw,10,5); ctx.fill();
    const tCol = tension>78 ? "#ef4444" : tension>55 ? "#f59e0b" : "#38bdf8";
    ctx.fillStyle = tCol; ctx.beginPath(); ctx.roundRect(x,y+29,bw*Math.min(1,tension/100),10,5); ctx.fill();

    ctx.fillStyle = "#e2e8f0"; ctx.fillText("FISH ENERGY", width/2, y+55);
    ctx.fillStyle = "#1e293b"; ctx.beginPath(); ctx.roundRect(x,y+59,bw,10,5); ctx.fill();
    ctx.fillStyle = "#a78bfa"; ctx.beginPath(); ctx.roundRect(x,y+59,bw*Math.min(1,fishStamina/100),10,5); ctx.fill();

    if(tension > 78){
      ctx.fillStyle = tension > 90 ? "#ef4444" : "#fca5a5";
      ctx.font = "bold 11px system-ui";
      ctx.fillText(tension > 90 ? "LINE SNAP IMMINENT!" : "EASE OFF!", width/2, y+82);
    }
  }

  if(state === "waiting" || state === "nibble" || state === "casting"){
    ctx.fillStyle = "rgba(255,255,255,0.55)";
    ctx.font = "10px system-ui";
    ctx.textAlign = "left";
    ctx.fillText("DEPTH " + Math.round((hookY/height)*100) + "%", 10, height-11);
  }
}

function render(dt){
  ctx.clearRect(0,0,width,height);
  drawSky();
  drawMountains();
  drawWater();
  drawFish();
  drawBoat();
  drawFishingLine();
  drawParticles(dt);
  drawRain();
  drawHUD();
}

function gameLoop(ts){
  // Advance time of day (full cycle ~8 minutes)
  timeOfDay = (timeOfDay + 0.00012) % 1;

  // Weather changes every ~90 seconds
  weatherTimer -= 0.016;
  if(weatherTimer <= 0){
    const weathers = ["clear","clear","cloudy","rain"];
    weather = weathers[Math.floor(Math.random()*weathers.length)];
    weatherTimer = 80 + Math.random()*40;
    if(weather === "rain" && rainParticles.length === 0){
      for(let i=0;i<60;i++) rainParticles.push({x:Math.random()*width,y:Math.random()*height*0.4,speed:6+Math.random()*6});
    }
  }
  if(!gameScreen.isConnected || gameScreen.style.display === "none"){
    animationFrame = null;
    return;
  }
  const dt = Math.min(0.048, lastTime ? (ts-lastTime)/1000 : 0.016);
  lastTime = ts;
  elapsed += dt;

  if(charging) castPower = Math.min(100, castPower + dt * 48 * stats.castSpeed);

  if(perfectHookWindow){
    hookWindowTimer -= dt;
    if(hookWindowTimer <= 0) perfectHookWindow = false;
  }
  if(state === "fighting" && targetFish){
    const sm = targetFish.type.size * targetFish.scale * targetFish.type.fight;
    const style = targetFish.type.style;
    const tMul = stats.tensionMul;

    fishStamina = Math.max(14, fishStamina - dt * (2.9 + sm * 1.15));

    tension += dt * (0.85 + sm * 0.52) * tMul;

    if(isReeling){
      const resistance = 1 + (100 - fishStamina) / 100;
      tension += dt * (11.5 + sm * 7.2) * resistance * tMul;
      const gain = dt * (16.5 + 8.2 / sm) * (0.72 + fishStamina / 200);
      reelProgress = Math.min(100, reelProgress + gain);
    } else {
      tension = Math.max(0, tension - dt * 27);
      reelProgress = Math.max(0, reelProgress - dt * (1.9 + sm));
    }

    runTimer -= dt;
    if(runTimer <= 0){
      const runChance = 0.13 + sm * 0.065 + (fishStamina > 60 ? 0.09 : 0);
      if(Math.random() < runChance){
        let dir = (Math.random() < 0.5 ? -1 : 1);
        if(style === "deep") dir *= 0.55;
        fishRunDir = dir * (1.15 + sm * 0.38) * (fishStamina / 100);
        tension += (10 + sm * 7.5) * tMul;
        if(style === "surface") statusText.textContent = "Surface run! Keep pressure but don't horse it.";
        else if(style === "deep") statusText.textContent = "Deep dive! Let it take some line.";
        else if(style === "fast") statusText.textContent = "Fast run! Stay smooth.";
        else statusText.textContent = "Fish is shaking its head...";
        runTimer = 0.9 + Math.random() * 1.25;
      } else {
        fishRunDir = 0;
        runTimer = 0.6 + Math.random() * 1.35;
      }
    }

    if(tension >= 100){
      sfxSnap();
      loseFish("Line snapped under the pressure.");
    } else if(reelProgress >= 100){
      landFish();
    }
  }

  render(dt);
  animationFrame = requestAnimationFrame(gameLoop);
}

function startGame(){
  clearAllTimers();
  resize();
  state = "idle";
  targetFish = null;
  reelProgress = 0; tension = 0; castPower = 0; charging = false; isReeling = false;
  fishStamina = 100; fishRunDir = 0; runTimer = 0; bitePhase = "none"; aimOffset = 0;
  particles = [];
  updateCounter();
  showIdleUI();
  statusText.textContent = "Hold CAST, drag left/right to aim, release to cast";
  if(animationFrame) cancelAnimationFrame(animationFrame);
  lastTime = 0; elapsed = 0;
  animationFrame = requestAnimationFrame(gameLoop);
}

function clearAllTimers(){
  clearTimeout(biteTimer); clearTimeout(escapeTimer); clearTimeout(nibbleTimer);
  biteTimer = escapeTimer = nibbleTimer = null;
}

function showIdleUI(){
  castBtn.style.display = "block";
  castBtn.disabled = false;
  castBtn.textContent = "🎣 CAST";
  reelBtn.style.display = "none";
  releaseBtn.style.display = "none";
  depthUp.style.display = "none";
  depthDown.style.display = "none";
}

// CAST
castBtn.addEventListener("pointerdown", e => {
  if(state !== "idle") return;
  e.preventDefault();
  initAudio();
  charging = true;
  castPower = 10;
  aimOffset = 0;
  pointerStartX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
  castBtn.textContent = "AIM + POWER"; });
castBtn.addEventListener("pointermove", e => {
  if(!charging || state !== "idle") return;
  const cx = e.clientX || (e.touches && e.touches[0].clientX) || pointerStartX;
  aimOffset = Math.max(-0.24, Math.min(0.24, (cx - pointerStartX) / width));
});
castBtn.addEventListener("pointerup", e => {
  if(!charging || state !== "idle") return;
  e.preventDefault();
  charging = false;
  doCast();
});
castBtn.addEventListener("pointerleave", () => {
  if(charging){ charging = false; castPower = 0; castBtn.textContent = "🎣 CAST"; }
});
castBtn.addEventListener("pointercancel", () => {
  if(charging){ charging = false; castPower = 0; castBtn.textContent = "🎣 CAST"; }
});

function doCast(){
  sfxCast();
  state = "casting";
  castBtn.disabled = true;
  castBtn.textContent = "🎣 CAST";
  const power = Math.max(22, castPower);
  const baseDist = (0.17 + power * 0.00215) * stats.castDist;
  hookX = boatX + width * (baseDist + aimOffset);
  hookX = Math.max(width * 0.17, Math.min(width * 0.83, hookX));
  const startY = height * 0.36;
  const endY = height * (0.56 + power * 0.0028);
  targetDepth = endY;
  statusText.textContent = "Casting...";
  const t0 = performance.now();
  const dur = 820 + power * 3.4;
  function anim(now){
    if(state !== "casting") return;
    const p = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - p, 2.5);
    hookY = startY + (endY - startY) * e;
    if(p < 1) requestAnimationFrame(anim);
    else {
      createSplash(hookX, hookY, 12);
      sfxSplash();
      startWaiting();
    }
  }
  requestAnimationFrame(anim);
}

function startWaiting(){
  state = "waiting";
  hookY = targetDepth;
  bitePhase = "none";
  const timeLabel = timeOfDay < 0.25 ? "Night" : timeOfDay < 0.35 ? "Dawn" : timeOfDay < 0.7 ? "Day" : timeOfDay < 0.8 ? "Dusk" : "Night";
  statusText.textContent = `Bait settled (${timeLabel}, ${weather}). Adjust depth or wait...`;
  depthUp.style.display = "block";
  depthDown.style.display = "block";
  castBtn.style.display = "none";

  const waitBase = 1500 + Math.random() * 4000;
  // Dawn/dusk bonus, rain slight bonus, night penalty
  let timeMul = 1;
  if(timeOfDay > 0.22 && timeOfDay < 0.32 || timeOfDay > 0.68 && timeOfDay < 0.78) timeMul = 0.65;
  else if(timeOfDay < 0.15 || timeOfDay > 0.88) timeMul = 1.4;
  if(weather === "rain") timeMul *= 0.8;
  if(weather === "cloudy") timeMul *= 0.9;
  const wait = (waitBase / stats.luck) * timeMul;

  biteTimer = setTimeout(() => {
    if(state !== "waiting") return;
    state = "nibble";
    bitePhase = "nibble";
    statusText.textContent = "Something's interested... bobber is moving";
    sfxNibble();
    nibbleTimer = setTimeout(() => {
      if(state !== "nibble") return;
      let cands = fish.filter(f => !f.caught && !f.hooked);
      if(!cands.length){ createFish(); cands = fish; }

      // Justin luck + Bob size preference
      cands.sort((a,b) => {
        const da = Math.abs(a.y - hookY) + Math.abs(a.x - hookX) * 0.35;
        const db = Math.abs(b.y - hookY) + Math.abs(b.x - hookX) * 0.35;
        let scoreA = da - (a.type.rarity < 0.5 ? 25 * stats.luck : 0);
        let scoreB = db - (b.type.rarity < 0.5 ? 25 * stats.luck : 0);
        if(selectedPlayer === "Bob"){
          scoreA -= a.type.size * 12;
          scoreB -= b.type.size * 12;
        }
        return scoreA - scoreB;
      });

      const chosen = cands[0];
      targetFish = chosen;
      chosen.x = hookX + (Math.random() - 0.5) * 18;
      chosen.y = hookY + 6;
      chosen.hooked = true;
      state = "biting";
      bitePhase = "take";
      fishStamina = 100;
      createSplash(hookX, hookY, 18);
      sfxBite(); sfxSplash();
      statusText.textContent = "FISH ON! Tap REEL to set the hook!";
      perfectHookWindow = true;
      hookWindowTimer = 0.55; // short perfect window
      depthUp.style.display = "none";
      depthDown.style.display = "none";
      reelBtn.style.display = "block";
      escapeTimer = setTimeout(() => {
        if(state === "biting"){
          sfxEscape();
          loseFish("Missed the take — fish got away.");
        }
      }, 3900);
    }, 850 + Math.random() * 1300);
  }, wait);
}

depthUp.addEventListener("click", () => {
  if(state !== "waiting" && state !== "nibble") return;
  hookY = Math.max(height * 0.46, hookY - height * 0.04);
  statusText.textContent = "Raised the bait...";
});
depthDown.addEventListener("click", () => {
  if(state !== "waiting" && state !== "nibble") return;
  hookY = Math.min(height * 0.88, hookY + height * 0.04);
  statusText.textContent = "Dropped the bait deeper...";
});

// REEL
reelBtn.addEventListener("pointerdown", e => {
  e.preventDefault();
  if(state === "biting"){
    clearTimeout(escapeTimer); escapeTimer = null;
    state = "fighting";
    const perfect = perfectHookWindow && hookWindowTimer > 0;
    reelProgress = perfect ? 28 : 15;
    tension = perfect ? 6 : 11;
    if(perfect) statusText.textContent = "Perfect set! Fish is stunned!";
    isReeling = true;
    fishStamina = 100;
    statusText.textContent = "Fight on! Hold to reel, release to ease tension.";
    sfxReel();
  } else if(state === "fighting"){
    isReeling = true;
    sfxReel();
  }
});
reelBtn.addEventListener("pointerup", () => { isReeling = false; });
reelBtn.addEventListener("pointerleave", () => { isReeling = false; });
reelBtn.addEventListener("pointercancel", () => { isReeling = false; });

function landFish(){
  if(state !== "fighting" || !targetFish) return;
  clearAllTimers();
  state = "caught";
  isReeling = false;
  const caught = targetFish;
  caught.caught = true;
  caught.hooked = false;
  createSplash(boatX, boatY + 7, 24);
  sfxSuccess(); sfxSplash();

  const t = caught.type;
  let inches = Math.round(t.min + Math.random() * (t.max - t.min));
  inches = Math.round(inches * stats.sizeMul);
  const pounds = Math.max(0.2, Math.pow(inches / 12, 3) * t.weight * (0.75 + Math.random() * 0.5) * stats.sizeMul);

  catches++;
  totalWeight += pounds;
  if(inches > bestFish.inches) bestFish = {name: t.name, inches, pounds};
  catchHistory.unshift({name:t.name, inches, pounds, rarity});
  if(catchHistory.length > 15) catchHistory.pop();
  saveStats();
  updateCounter();

  let title = "FISH CAUGHT!", rarity = "Common";
  if(inches >= 28 || t.rarity < 0.28){ title = "LEGENDARY CATCH!"; rarity = "Legendary"; }
  else if(inches >= 22 || t.rarity < 0.48){ title = "TROPHY FISH!"; rarity = "Trophy"; }
  else if(t.rarity < 0.7){ title = "NICE CATCH!"; rarity = "Rare"; }

  statusText.textContent = "🎉 " + title;
  castBtn.style.display = "none";
  reelBtn.style.display = "none";
  releaseBtn.style.display = "block";
  depthUp.style.display = "none";
  depthDown.style.display = "none";

  catchEmoji.textContent = t.emoji;
  $("catch-title").textContent = title;
  catchDetails.innerHTML = `
    <strong>Species:</strong> ${t.name}<br>
    <strong>Length:</strong> ${inches} in<br>
    <strong>Est. weight:</strong> ${pounds.toFixed(1)} lbs<br>
    <strong>Rarity:</strong> ${rarity}<br>
    <strong>Angler bonus:</strong> ${stats.label}<br>
    <strong>Total catches:</strong> ${catches}<br>
    <strong>Total weight:</strong> ${totalWeight.toFixed(1)} lbs`;
  catchCard.style.display = "block";
}

function loseFish(msg){
  clearAllTimers();
  if(targetFish){ targetFish.hooked = false; targetFish = null; }
  state = "idle";
  reelProgress = 0; tension = 0; castPower = 0; isReeling = false;
  fishStamina = 100; fishRunDir = 0; runTimer = 0; bitePhase = "none";
  showIdleUI();
  statusText.textContent = msg;
}

keepFishingBtn.addEventListener("click", closeCatch);
releaseBtn.addEventListener("click", closeCatch);
function closeCatch(){
  catchCard.style.display = "none";
  if(targetFish){ targetFish.caught = true; targetFish.hooked = false; targetFish = null; }
  if(fish.filter(f => !f.caught).length < 7) createFish();
  state = "idle";
  reelProgress = 0; tension = 0; isReeling = false;
  showIdleUI();
  statusText.textContent = "Hold CAST, drag left/right to aim, release to cast";
}

logBtn.addEventListener("click", () => {
  let recent = catchHistory.slice(0,5).map(c => `${c.name}: ${c.inches} in / ${c.pounds.toFixed(1)} lbs (${c.rarity})`).join("<br>") || "No catches yet";
  logContent.innerHTML = `
    <strong>Total catches:</strong> ${catches}<br>
    <strong>Total weight:</strong> ${totalWeight.toFixed(1)} lbs<br>
    <strong>Best fish:</strong> ${bestFish.name}<br>
    ${bestFish.inches ? bestFish.inches + " in / " + bestFish.pounds.toFixed(1) + " lbs" : "—"}<br><br>
    <strong>Recent:</strong><br>${recent}`;
  logModal.style.display = "block";
});
closeLogBtn.addEventListener("click", () => logModal.style.display = "none");


const volumeSlider = $("volumeSlider");
const muteBtn = $("muteBtn");
volumeSlider.addEventListener("input", e => { volume = parseFloat(e.target.value); muted = volume===0; muteBtn.textContent = muted ? "🔇" : "🔊"; });
muteBtn.addEventListener("click", () => {
  muted = !muted;
  muteBtn.textContent = muted ? "🔇" : "🔊";
  if(!muted && volume===0) volume=0.7;
  volumeSlider.value = muted ? 0 : volume;
});

function updateCounter(){ fishCounter.textContent = "Catches: " + catches; }

window.addEventListener("resize", () => {
  if(gameScreen.style.display === "flex") resize();
});
document.addEventListener("visibilitychange", () => {
  if(document.hidden){
    clearTimeout(biteTimer); biteTimer = null;
    clearTimeout(escapeTimer); escapeTimer = null;
    clearTimeout(nibbleTimer); nibbleTimer = null;
  }
});

// Keyboard controls
document.addEventListener("keydown", e => {
  if(e.repeat) return;
  if(e.code === "Space" || e.code === "Enter"){
    e.preventDefault();
    if(state === "idle" && castBtn.style.display !== "none"){
      castBtn.dispatchEvent(new PointerEvent("pointerdown", {clientX: width/2}));
      setTimeout(() => castBtn.dispatchEvent(new PointerEvent("pointerup")), 400);
    } else if(state === "biting" || state === "fighting"){
      reelBtn.dispatchEvent(new PointerEvent("pointerdown"));
    }
  }
  if(e.code === "ArrowUp"){ depthUp.click(); }
  if(e.code === "ArrowDown"){ depthDown.click(); }
  if(e.code === "KeyL"){ logBtn.click(); }
});
document.addEventListener("keyup", e => {
  if(e.code === "Space" || e.code === "Enter"){
    if(state === "fighting") reelBtn.dispatchEvent(new PointerEvent("pointerup"));
  }
});
})();
</script>
</body>
</html>
