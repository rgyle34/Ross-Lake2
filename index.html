<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ross Lake — Wilderness Fishing Adventure</title>

<style>
:root {
  color-scheme: dark;
  --blue: #58d8f4;
  --panel: #102c3b;
  --text: #effaff;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: #061722;
  color: var(--text);
  font-family: system-ui, -apple-system, sans-serif;
}

button {
  font: inherit;
  cursor: pointer;
  touch-action: manipulation;
}

button:focus-visible {
  outline: 3px solid white;
  outline-offset: 3px;
}

#selection {
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: 20px;
  background:
    radial-gradient(ellipse at top, #226b7d, transparent 65%),
    linear-gradient(#102f40, #06131d);
}

.panel {
  width: min(100%, 480px);
  text-align: center;
}

.eyebrow {
  color: #9beeff;
  font-size: .72rem;
  font-weight: 800;
  letter-spacing: .25em;
}

h1 {
  font-size: clamp(2.8rem, 11vw, 4.6rem);
  line-height: 1;
  margin: 12px 0 8px;
  color: white;
  text-shadow: 0 4px #075985, 0 0 25px #38bdf855;
}

.tagline {
  color: #b7d8e5;
  letter-spacing: .13em;
  font-size: .75rem;
  margin-bottom: 25px;
}

#anglerGrid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 11px;
  margin-bottom: 18px;
}

.angler {
  color: white;
  border: 2px solid #34586a;
  border-radius: 17px;
  background: linear-gradient(145deg, #194052, #0a2230);
  padding: 9px;
  min-width: 0;
}

.angler.selected {
  border-color: #75eaff;
  background: linear-gradient(145deg, #176581, #103447);
  box-shadow: 0 0 18px #38bdf833;
}

.portrait {
  width: 100%;
  max-width: 190px;
  height: 85px;
  display: block;
  margin: 0 auto 5px;
  border-radius: 9px;
}

.angler strong {
  display: block;
  font-size: 1rem;
}

.angler p {
  color: #c1d9e4;
  font-size: .72rem;
  margin: 3px 0 2px;
}

.primary {
  border: 0;
  border-radius: 13px;
  padding: 14px 18px;
  background: linear-gradient(100deg, #38bdf8, #67e8f9);
  color: #052436;
  font-weight: 950;
  box-shadow: 0 4px #0e7490;
}

#startButton {
  width: min(100%, 300px);
}

#selectedInfo {
  color: #b8dce9;
  margin-top: 13px;
  font-size: .85rem;
}

#game {
  display: none;
  flex-direction: column;
  width: 100%;
  height: 100dvh;
  min-height: 430px;
  overflow: hidden;
}

#top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 7px;
  padding: 10px;
  background: #0b2432;
  border-bottom: 1px solid #285065;
  font-size: .78rem;
}

#anglerName {
  color: #7de6ff;
  font-weight: 900;
}

#count {
  white-space: nowrap;
  font-weight: 800;
}

#status {
  display: grid;
  place-items: center;
  text-align: center;
  min-height: 48px;
  padding: 8px 12px;
  background: #0c2939;
  border-bottom: 1px solid #24495a;
  font-size: .84rem;
  font-weight: 700;
}

#stats {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 6px 12px;
  background: #0a202d;
  color: #b9e8f4;
  font-size: .75rem;
}

#scene {
  display: block;
  width: 100%;
  flex: 1;
  min-height: 0;
  background: #07516b;
}

#controls {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  padding: 10px 9px calc(10px + env(safe-area-inset-bottom));
  background: #071722;
  border-top: 1px solid #24495a;
}

.action {
  flex: 1 1 26%;
  max-width: 190px;
  min-width: 80px;
  min-height: 48px;
  padding: 9px 7px;
  border: 0;
  border-radius: 12px;
  background: linear-gradient(145deg, #38bdf8, #67e8f9);
  color: #052436;
  font-size: .78rem;
  font-weight: 950;
  box-shadow: 0 3px #0e7490;
}

.action.green {
  background: linear-gradient(145deg, #86efac, #4ade80);
  box-shadow: 0 3px #166534;
}

.action.orange {
  background: linear-gradient(145deg, #fde68a, #fb923c);
  box-shadow: 0 3px #9a3412;
}

.action.gray {
  background: linear-gradient(145deg, #94a3b8, #64748b);
  box-shadow: 0 3px #334155;
}

.action:disabled {
  opacity: .35;
}

.overlay {
  display: none;
  position: fixed;
  z-index: 10;
  inset: 50% auto auto 50%;
  transform: translate(-50%, -50%);
  width: min(92%, 390px);
  max-height: 88dvh;
  overflow-y: auto;
  padding: 20px;
  border: 2px solid #67e8f9;
  border-radius: 20px;
  background: linear-gradient(160deg, #17475b, #071827);
  box-shadow: 0 0 0 100vmax #000b;
  text-align: center;
}

.overlay h2 {
  color: #a5f3fc;
  margin: 0 0 8px;
}

#catchCanvas {
  width: 100%;
  height: auto;
  border-radius: 12px;
  margin-top: 8px;
  background: #12536a;
}

.details {
  line-height: 1.8;
  color: #e0f4fc;
  font-size: .9rem;
  margin: 12px 0 17px;
}

.overlay button {
  width: 100%;
  margin-top: 7px;
}

.journalEntry {
  text-align: left;
  padding: 10px;
  margin: 8px 0;
  border: 1px solid #3b6475;
  border-radius: 10px;
  background: #0c2b3b;
  font-size: .85rem;
  line-height: 1.6;
}

@media (max-height: 620px) {
  .tagline { margin-bottom: 12px; }
  .portrait { height: 55px; }
  .angler { padding: 5px; }
  #controls { padding-top: 6px; padding-bottom: 6px; gap: 6px; }
  .action { min-height: 42px; }
}

@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto; }
}
</style>
</head>

<body>

<section id="selection">
  <div class="panel">
    <div class="eyebrow">PACIFIC NORTHWEST</div>
    <h1>ROSS LAKE</h1>
    <div class="tagline">WILDERNESS FISHING ADVENTURE</div>

    <div id="anglerGrid"></div>

    <button id="startButton" class="primary">START FISHING</button>
    <div id="selectedInfo">Choose your angler to begin.</div>
  </div>
</section>

<section id="game">
  <header id="top">
    <span id="anglerName">Angler</span>
    <strong>ROSS LAKE</strong>
    <span id="count">Catches: 0</span>
  </header>

  <div id="status">Choose your angler and cast your line.</div>

  <div id="stats">
    <span id="biggest">Biggest: 0.00 lb</span>
    <span id="sessionWeight">Total: 0.00 lb</span>
  </div>

  <canvas id="scene" aria-label="Fishing lake with fish, boat, fishing line and lure"></canvas>

  <nav id="controls">
    <button id="castButton" class="action">🎣 CAST</button>
    <button id="hookButton" class="action orange" disabled>⚡ SET HOOK</button>
    <button id="reelButton" class="action green" disabled>⬆ REEL IN</button>
    <button id="runButton" class="action gray" disabled>↔ LET IT RUN</button>
    <button id="journalButton" class="action">📖 JOURNAL</button>
    <button id="changeAnglerButton" class="action gray">↩ ANGLERS</button>
  </nav>
</section>

<div id="catchScreen" class="overlay">
  <h2>FISH LANDED!</h2>
  <canvas id="catchCanvas" width="600" height="300"></canvas>
  <div id="catchDetails" class="details"></div>
  <button id="continueButton" class="primary">KEEP FISHING</button>
</div>

<div id="journalScreen" class="overlay">
  <h2>Fishing Journal</h2>
  <div id="journalStats" class="details"></div>
  <div id="journalList"></div>
  <button id="journalClose" class="primary">CLOSE JOURNAL</button>
</div>

<script>
(() => {
'use strict';

const $ = id => document.getElementById(id);
const canvas = $('scene');
const ctx = canvas.getContext('2d');
const catchCanvas = $('catchCanvas');
const catchCtx = catchCanvas.getContext('2d');

const anglers = [
  {
    name: 'Clay',
    trait: 'Steady & patient',
    skin: '#c58c68',
    hair: '#493126',
    beard: '#77513a',
    shirt: '#58764a',
    hat: '#c4a06a',
    skill: 1.18,
    luck: 1,
    trophy: 1
  },
  {
    name: 'Ryan',
    trait: 'Fast caster',
    skin: '#e0b18a',
    hair: '#49352a',
    beard: '#49352a',
    shirt: '#315f8c',
    hat: '#d9c8a1',
    skill: 1.3,
    luck: 1,
    trophy: 1
  },
  {
    name: 'Justin',
    trait: 'Lucky angler',
    skin: '#c58a62',
    hair: '#30251f',
    beard: '#30251f',
    shirt: '#a65e43',
    hat: '#496044',
    skill: 1,
    luck: 1.5,
    trophy: 1
  },
  {
    name: 'Bob',
    trait: 'Trophy hunter',
    skin: '#e2ba98',
    hair: '#aaa08c',
    beard: '#c3b6a0',
    shirt: '#75618c',
    hat: '#907750',
    skill: 1,
    luck: 1.1,
    trophy: 1.3
  }
];

const species = [
  {
    name: 'Rainbow Trout',
    min: 0.7, max: 5.5, rarity: 34,
    body: '#c6d6c6', back: '#587d59',
    belly: '#eee2c1', spot: '#4c5747',
    size: 1
  },
  {
    name: 'Kokanee Salmon',
    min: 1, max: 4.5, rarity: 22,
    body: '#d87869', back: '#65766d',
    belly: '#f3d3b2', spot: '#ad4d43',
    size: 1.05
  },
  {
    name: 'Smallmouth Bass',
    min: 0.8, max: 5.8, rarity: 24,
    body: '#b7b27a', back: '#66774a',
    belly: '#e7dca9', spot: '#4b6142',
    size: 1.05
  },
  {
    name: 'Bull Trout',
    min: 2, max: 12, rarity: 12,
    body: '#b9c4b4', back: '#344e4a',
    belly: '#d8dfc8', spot: '#c77b60',
    size: 1.25
  },
  {
    name: 'Lake Trout',
    min: 3, max: 20, rarity: 8,
    body: '#bdc6b6', back: '#50635d',
    belly: '#e3dfc5', spot: '#384b46',
    size: 1.35
  }
];

let selected = 0;
let W = 1, H = 1, DPR = 1;
let time = 0, last = 0, raf = 0;
let mode = 'idle';
let started = false;
let shoal = [];
let particles = [];
let hooked = null;
let lure = { x: 0, y: 0 };
let castProgress = 0;
let biteTime = 0;
let waitTime = 0;
let fightTime = 0;
let distance = 1;
let tension = 15;
let stamina = 100;
let caught = [];
let totalWeight = 0;
let biggest = 0;
let totalCaught = 0;
let bestRecord = null;

try {
  const saved = JSON.parse(localStorage.getItem('rossLakeStatsV2') || '{}');
  caught = Array.isArray(saved.caught) ? saved.caught : [];
  totalWeight = Number(saved.totalWeight) || 0;
  biggest = Number(saved.biggest) || 0;
  totalCaught = Number(saved.totalCaught) || 0;
  bestRecord = saved.bestRecord || null;
} catch (e) {}

function saveStats() {
  try {
    localStorage.setItem('rossLakeStatsV2', JSON.stringify({
      caught: caught.slice(0, 100),
      totalWeight,
      biggest,
      totalCaught,
      bestRecord
    }));
  } catch (e) {}
}

function rand(a, b) {
  return a + Math.random() * (b - a);
}

function renderAnglers() {
  const grid = $('anglerGrid');
  grid.innerHTML = '';

  anglers.forEach((a, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'angler' + (i === selected ? ' selected' : '');

    const portrait = document.createElement('canvas');
    portrait.width = 240;
    portrait.height = 100;
    portrait.className = 'portrait';

    b.appendChild(portrait);
    const g = portrait.getContext('2d');
    drawPortrait(g, a);

    const name = document.createElement('strong');
    name.textContent = a.name;
    b.appendChild(name);

    const trait = document.createElement('p');
    trait.textContent = a.trait;
    b.appendChild(trait);

    b.addEventListener('click', () => {
      selected = i;
      renderAnglers();
      $('selectedInfo').textContent = a.name + ' selected — ' + a.trait + '.';
    });

    grid.appendChild(b);
  });
}

function drawPortrait(g, a) {
  const gr = g.createLinearGradient(0, 0, 0, 100);
  gr.addColorStop(0, '#85b3bc');
  gr.addColorStop(1, '#d0d5bb');
  g.fillStyle = gr;
  g.fillRect(0, 0, 240, 100);

  g.fillStyle = '#45695c';
  g.beginPath();
  g.moveTo(0, 75);
  g.lineTo(50, 28);
  g.lineTo(95, 73);
  g.lineTo(145, 17);
  g.lineTo(205, 76);
  g.lineTo(240, 40);
  g.lineTo(240, 100);
  g.lineTo(0, 100);
  g.fill();

  g.fillStyle = a.shirt;
  g.beginPath();
  g.moveTo(35, 100);
  g.lineTo(75, 68);
  g.lineTo(165, 68);
  g.lineTo(205, 100);
  g.fill();

  g.fillStyle = a.skin;
  g.beginPath();
  g.ellipse(120, 48, 28, 30, 0, 0, Math.PI * 2);
  g.fill();

  g.fillStyle = a.hair;
  g.beginPath();
  g.ellipse(120, 34, 30, 20, Math.PI, 0);
  g.fill();

  if (a.name !== 'Ryan') {
    g.fillStyle = a.beard;
    g.beginPath();
    g.moveTo(94, 55);
    g.lineTo(100, 75);
    g.lineTo(120, 86);
    g.lineTo(141, 74);
    g.lineTo(147, 55);
    g.lineTo(133, 67);
    g.lineTo(105, 67);
    g.fill();
  }

  g.fillStyle = '#fff4dd';
  g.beginPath();
  g.ellipse(109, 48, 6, 4, 0, 0, Math.PI * 2);
  g.ellipse(132, 48, 6, 4, 0, 0, Math.PI * 2);
  g.fill();

  g.fillStyle = '#252821';
  g.beginPath();
  g.arc(109, 48, 2.5, 0, Math.PI * 2);
  g.arc(132, 48, 2.5, 0, Math.PI * 2);
  g.fill();

  g.fillStyle = a.hat;
  g.beginPath();
  g.ellipse(120, 30, 45, 6, 0, 0, Math.PI * 2);
  g.fill();
  g.beginPath();
  g.moveTo(96, 31);
  g.quadraticCurveTo(99, 6, 120, 8);
  g.quadraticCurveTo(141, 6, 144, 31);
  g.fill();
}

function resize() {
  const r = canvas.getBoundingClientRect();
  if (!r.width || !r.height) return;

  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = r.width;
  H = r.height;

  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  makeShoal();
  draw();
}

function makeShoal() {
  shoal = [];

  for (let i = 0; i < 15; i++) {
    const sp = species[Math.floor(Math.random() * species.length)];

    shoal.push({
      species: sp,
      x: Math.random() * W,
      y: H * (0.76 + Math.random() * 0.20),
      size: (7 + Math.random() * 8) * sp.size,
      speed: 8 + Math.random() * 20,
      dir: Math.random() < 0.5 ? -1 : 1,
      phase: Math.random() * 6.28
    });
  }
}

function setStatus(text) {
  $('status').textContent = text;
}

function updateStats() {
  $('count').textContent = 'Catches: ' + totalCaught;
  $('biggest').textContent = 'Biggest: ' + biggest.toFixed(2) + ' lb';
  $('sessionWeight').textContent = 'Total: ' + totalWeight.toFixed(2) + ' lb';
}

$('startButton').addEventListener('click', () => {
  if (started) return;

  started = true;
  $('selection').style.display = 'none';
  $('game').style.display = 'flex';
  $('anglerName').textContent = '🎣 ' + anglers[selected].name;

  resize();
  updateStats();

  setStatus('Look beneath the boat. Tap CAST to begin fishing!');

  if (!raf) {
    last = 0;
    raf = requestAnimationFrame(loop);
  }
});

$('changeAnglerButton').addEventListener('click', () => {
  if (mode !== 'idle') {
    setStatus('Finish your current cast before changing anglers.');
    return;
  }

  started = false;
  $('game').style.display = 'none';
  $('selection').style.display = 'grid';
  renderAnglers();
});

function setButtons() {
  $('castButton').disabled = mode !== 'idle';
  $('hookButton').disabled = mode !== 'bite';
  $('reelButton').disabled = mode !== 'fight';
  $('runButton').disabled = mode !== 'fight';
}

function cast() {
  if (!started || mode !== 'idle') return;

  mode = 'casting';
  castProgress = 0;
  hooked = null;
  tension = 15;
  stamina = 100;
  distance = 1;

  lure.x = W * 0.54;
  lure.y = H * 0.66;

  setButtons();
  setStatus('Casting! Watch the line and lure fly into the water.');
}

$('castButton').addEventListener('click', cast);

function beginWaiting() {
  mode = 'waiting';
  waitTime = rand(3.5, 7.5);

  setButtons();
  setStatus('Your lure is in the water. Watch closely for a bite!');
}

function chooseSpecies() {
  const a = anglers[selected];
  const weighted = [];

  species.forEach(s => {
    for (let i = 0; i < Math.max(1, Math.round(s.rarity * a.luck)); i++) {
      weighted.push(s);
    }
  });

  return weighted[Math.floor(Math.random() * weighted.length)];
}

function bite() {
  mode = 'bite';
  biteTime = 3.5;

  setButtons();
  setStatus('🐟 A FISH IS BITING! Tap SET HOOK now!');
}

$('hookButton').addEventListener('click', () => {
  if (mode !== 'bite') return;

  const sp = chooseSpecies();
  const a = anglers[selected];

  const weight = Math.min(
    sp.max,
    (sp.min + Math.random() * (sp.max - sp.min)) * a.trophy
  );

  hooked = {
    species: sp,
    weight: Math.max(sp.min, weight),
    length: Math.round(7 + weight * 3.1 + Math.random() * 5),
    size: (18 + weight * 1.6) * sp.size,
    phase: Math.random() * 6.28,
    x: W * 0.52,
    y: H * 0.83
  };

  mode = 'fight';
  fightTime = 0;
  distance = 1;
  stamina = 100;
  tension = 22;

  particles = [];
  splash(lure.x, lure.y, 20);
  setButtons();
  setStatus('HOOK SET! You can see your fish below the boat. Reel it in!');
});

function reel() {
  if (mode !== 'fight' || !hooked) return;

  if (tension > 76) {
    setStatus('The fish is pulling hard! Tap LET IT RUN to relax the line.');
    return;
  }

  distance -= 0.075 * anglers[selected].skill;
  stamina -= 7;
  tension += 5;

  if (distance <= 0.04 || stamina <= 0) {
    landFish();
    return;
  }

  setStatus('Reeling in! The fish is getting closer.');
}

$('reelButton').addEventListener('click', reel);

$('runButton').addEventListener('click', () => {
  if (mode !== 'fight' || !hooked) return;

  tension = Math.max(5, tension - 25);
  distance = Math.min(1, distance + 0.015);
  stamina = Math.max(0, stamina - 2);

  setStatus('Letting the fish run. The line is relaxing.');

  if (stamina <= 0) landFish();
});

function landFish() {
  if (!hooked) return;

  const f = hooked;
  const entry = {
    name: f.species.name,
    weight: Number(f.weight.toFixed(2)),
    length: f.length,
    angler: anglers[selected].name,
    body: f.species.body,
    back: f.species.back,
    belly: f.species.belly,
    spot: f.species.spot,
    size: f.size,
    time: new Date().toLocaleString()
  };

  caught.unshift(entry);
  caught = caught.slice(0, 100);

  totalCaught++;
  totalWeight += entry.weight;

  if (entry.weight > biggest) {
    biggest = entry.weight;
    bestRecord = entry;
  }

  saveStats();
  updateStats();

  hooked = null;
  mode = 'idle';
  tension = 0;
  stamina = 100;

  setButtons();
  showCatchScreen(entry);
}

function showCatchScreen(f) {
  $('catchDetails').innerHTML = '';

  const lines = [
    ['Species', f.name],
    ['Weight', f.weight.toFixed(2) + ' lb'],
    ['Length', f.length + ' inches'],
    ['Angler', f.angler],
    ['Caught', f.time]
  ];

  lines.forEach(([label, value]) => {
    const row = document.createElement('div');
    const strong = document.createElement('strong');
    strong.textContent = label + ': ';
    row.appendChild(strong);
    row.appendChild(document.createTextNode(value));
    $('catchDetails').appendChild(row);
  });

  drawCatchPicture(f);
  $('catchScreen').style.display = 'block';
  setStatus('Fish landed! Your catch statistics have been recorded.');
}

function drawCatchPicture(f) {
  const g = catchCtx;
  const w = catchCanvas.width;
  const h = catchCanvas.height;

  const sky = g.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0, '#8fc4d0');
  sky.addColorStop(0.52, '#367c8a');
  sky.addColorStop(1, '#10384a');

  g.fillStyle = sky;
  g.fillRect(0, 0, w, h);

  g.fillStyle = '#577c75';
  g.beginPath();
  g.moveTo(0, 130);
  g.lineTo(90, 35);
  g.lineTo(165, 105);
  g.lineTo(270, 20);
  g.lineTo(390, 105);
  g.lineTo(480, 42);
  g.lineTo(600, 130);
  g.lineTo(600, 200);
  g.lineTo(0, 200);
  g.fill();

  g.fillStyle = '#256c7c';
  g.fillRect(0, 150, w, h - 150);

  for (let i = 0; i < 10; i++) {
    g.strokeStyle = '#c2e8e688';
    g.beginPath();
    g.moveTo(20 + i * 59, 200 + (i % 3) * 12);
    g.lineTo(60 + i * 53, 200 + (i % 3) * 12);
    g.stroke();
  }

  const size = Math.min(115, 42 + f.weight * 2);
  drawFish(g, w / 2, h * 0.59, size, f, 1, false);

  g.fillStyle = '#fff1c5';
  g.font = 'bold 20px system-ui';
  g.textAlign = 'center';
  g.fillText('ROSS LAKE TROPHY', w / 2, 30);

  g.fillStyle = 'white';
  g.font = 'bold 17px system-ui';
  g.fillText(f.weight.toFixed(2) + ' LB  •  ' + f.length + ' IN', w / 2, h - 20);
}

$('continueButton').addEventListener('click', () => {
  $('catchScreen').style.display = 'none';
  setStatus('Ready for another cast. Watch the fish below your boat!');
});

function showJournal() {
  $('journalList').innerHTML = '';

  $('journalStats').textContent =
    'Total catches: ' + totalCaught +
    ' · Total weight: ' + totalWeight.toFixed(2) +
    ' lb · Biggest fish: ' + biggest.toFixed(2) + ' lb';

  if (!caught.length) {
    const empty = document.createElement('div');
    empty.className = 'journalEntry';
    empty.textContent = 'No fish caught yet. Cast your line to begin!';
    $('journalList').appendChild(empty);
  } else {
    caught.forEach((f, i) => {
      const entry = document.createElement('div');
      entry.className = 'journalEntry';

      const title = document.createElement('strong');
      title.textContent = '#' + (i + 1) + ' · ' + f.name;
      entry.appendChild(title);

      const details = document.createElement('div');
      details.textContent =
        f.weight.toFixed(2) + ' lb · ' + f.length + ' inches';
      entry.appendChild(details);

      const angler = document.createElement('div');
      angler.textContent = 'Angler: ' + f.angler;
      entry.appendChild(angler);

      const timeLabel = document.createElement('div');
      timeLabel.textContent = f.time;
      timeLabel.style.opacity = '.7';
      entry.appendChild(timeLabel);

      $('journalList').appendChild(entry);
    });
  }

  $('journalScreen').style.display = 'block';
}

$('journalButton').addEventListener('click', showJournal);

$('journalClose').addEventListener('click', () => {
  $('journalScreen').style.display = 'none';
});

function splash(x, y, n = 14) {
  for (let i = 0; i < n; i++) {
    particles.push({
      x, y,
      vx: rand(-75, 75),
      vy: rand(-110, -20),
      life: rand(0.3, 0.8),
      size: rand(1.5, 4)
    });
  }
}

function drawBackground() {
  const sky = ctx.createLinearGradient(0, 0, 0, H * 0.56);
  sky.addColorStop(0, '#6b9fb3');
  sky.addColorStop(0.7, '#c1d6ca');
  sky.addColorStop(1, '#e4dcbf');

  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#e3e9df';
  ctx.beginPath();
  ctx.moveTo(0, H * 0.43);

  for (let x = 0; x <= W + 10; x += 24) {
    ctx.lineTo(
      x,
      H * (0.32 + Math.sin(x * 0.015) * 0.045)
    );
  }

  ctx.lineTo(W, H * 0.54);
  ctx.lineTo(0, H * 0.54);
  ctx.fill();

  ctx.fillStyle = '#536f60';
  ctx.beginPath();
  ctx.moveTo(0, H * 0.50);

  for (let x = 0; x <= W + 10; x += 18) {
    ctx.lineTo(x, H * (0.45 + Math.sin(x * 0.018) * 0.025));
  }

  ctx.lineTo(W, H * 0.62);
  ctx.lineTo(0, H * 0.62);
  ctx.fill();

  ctx.fillStyle = '#173e32';
  for (let x = 4; x < W; x += 22) {
    const y = H * (0.52 + Math.sin(x * 0.026) * 0.012);
    const s = 14 + (Math.floor(x) % 20);

    ctx.beginPath();
    ctx.moveTo(x, y - s);
    ctx.lineTo(x - 10, y + 2);
    ctx.lineTo(x + 10, y + 2);
    ctx.fill();
  }

  const water = ctx.createLinearGradient(0, H * 0.52, 0, H);
  water.addColorStop(0, '#52989b');
  water.addColorStop(0.45, '#276e7c');
  water.addColorStop(1, '#092f42');

  ctx.fillStyle = water;
  ctx.fillRect(0, H * 0.52, W, H * 0.48);

  for (let i = 0; i < 45; i++) {
    const y = H * 0.56 + ((i * 19 + time * 8) % (H * 0.42));
    const x = (i * 71 + Math.sin(time * 0.4 + i) * 18) % W;

    ctx.strokeStyle = 'rgba(218,245,229,.18)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + 10 + (i % 7) * 5, y);
    ctx.stroke();
  }
}

function drawBoat() {
  const x = W * 0.5;
  const y = H * 0.735 + Math.sin(time * 1.3) * 2;
  const a = anglers[selected];

  ctx.fillStyle = 'rgba(0,0,0,.2)';
  ctx.beginPath();
  ctx.ellipse(x, y + 24, 77, 8, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#65452f';
  ctx.beginPath();
  ctx.moveTo(x - 76, y);
  ctx.lineTo(x + 76, y);
  ctx.lineTo(x + 55, y + 25);
  ctx.lineTo(x - 54, y + 25);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#b48b59';
  ctx.beginPath();
  ctx.moveTo(x - 69, y - 4);
  ctx.lineTo(x + 68, y - 4);
  ctx.lineTo(x + 53, y + 10);
  ctx.lineTo(x - 52, y + 10);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = a.shirt;
  ctx.beginPath();
  ctx.ellipse(x - 3, y - 29, 19, 24, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = a.skin;
  ctx.beginPath();
  ctx.arc(x - 3, y - 57, 13, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = a.hair;
  ctx.beginPath();
  ctx.arc(x - 3, y - 61, 13, Math.PI, 6.2);
  ctx.fill();

  if (a.name !== 'Ryan') {
    ctx.fillStyle = a.beard;
    ctx.beginPath();
    ctx.moveTo(x - 15, y - 54);
    ctx.lineTo(x - 12, y - 43);
    ctx.lineTo(x - 3, y - 39);
    ctx.lineTo(x + 8, y - 44);
    ctx.lineTo(x + 9, y - 54);
    ctx.fill();
  }

  ctx.fillStyle = a.hat;
  ctx.beginPath();
  ctx.ellipse(x - 3, y - 63, 19, 4, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(x - 13, y - 64);
  ctx.quadraticCurveTo(x - 10, y - 77, x - 2, y - 77);
  ctx.quadraticCurveTo(x + 9, y - 76, x + 10, y - 64);
  ctx.fill();

  // Fishing rod.
  ctx.strokeStyle = '#3b2a1c';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(x + 15, y - 39);
  ctx.lineTo(x + 44, y - 102);
  ctx.stroke();

  ctx.strokeStyle = '#e1d0a8';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(x + 44, y - 102);
  ctx.quadraticCurveTo(x + 60, y - 78, x + 55, y - 49);
  ctx.stroke();
}

function drawFish(g, x, y, size, f, alpha = 1, animate = true) {
  g.save();
  g.globalAlpha = alpha;
  g.translate(x, y);

  if (animate) {
    g.scale(-1, 1);
  }

  // Tail.
  g.fillStyle = f.back;
  g.beginPath();
  g.moveTo(-size * 0.56, 0);
  g.lineTo(-size * 1.08, -size * 0.43);
  g.lineTo(-size * 1.02, 0);
  g.lineTo(-size * 1.08, size * 0.43);
  g.closePath();
  g.fill();

  // Top fin.
  g.beginPath();
  g.moveTo(-size * 0.17, -size * 0.14);
  g.lineTo(-size * 0.04, -size * 0.44);
  g.lineTo(size * 0.24, -size * 0.15);
  g.closePath();
  g.fill();

  // Body.
  g.fillStyle = f.back;
  g.beginPath();
  g.ellipse(0, 0, size * 0.69, size * 0.35, 0, 0, Math.PI * 2);
  g.fill();

  g.fillStyle = f.body || f.color;
  g.beginPath();
  g.ellipse(size * 0.04, -size * 0.03, size * 0.62, size * 0.28, -0.03, 0, Math.PI * 2);
  g.fill();

  // Belly.
  g.fillStyle = f.belly;
  g.beginPath();
  g.ellipse(size * 0.05, size * 0.15, size * 0.45, size * 0.12, 0, 0, Math.PI);
  g.fill();

  // Fins.
  g.fillStyle = f.back;
  g.beginPath();
  g.moveTo(-size * 0.02, size * 0.04);
  g.lineTo(size * 0.23, size * 0.31);
  g.lineTo(size * 0.32, size * 0.03);
  g.closePath();
  g.fill();

  // Species markings.
  for (let i = 0; i < 7; i++) {
    g.fillStyle = f.spot;
    g.beginPath();
    g.arc(
      -size * 0.28 + (i % 4) * size * 0.14,
      (i % 2 ? 1 : -1) * size * 0.1,
      Math.max(0.7, size * 0.035),
      0,
      Math.PI * 2
    );
    g.fill();
  }

  // Eye.
  g.fillStyle = '#fff5d9';
  g.beginPath();
  g.arc(size * 0.51, -size * 0.06, Math.max(1.2, size * 0.08), 0, Math.PI * 2);
  g.fill();

  g.fillStyle = '#12231f';
  g.beginPath();
  g.arc(size * 0.53, -size * 0.06, Math.max(0.7, size * 0.04), 0, Math.PI * 2);
  g.fill();

  g.restore();
}

function drawFishSchool() {
  for (const f of shoal) {
    drawFish(ctx, f.x, f.y, f.size, {
      body: f.species.body,
      back: f.species.back,
      belly: f.species.belly,
      spot: f.species.spot
    }, 0.9);
  }
}

function drawFishingLine() {
  if (!['casting', 'waiting', 'bite', 'fight'].includes(mode)) return;

  const sx = W * 0.5 + 55;
  const sy = H * 0.735 - 90;

  let ex = lure.x;
  let ey = lure.y;

  if (mode === 'fight' && hooked) {
    ex = hooked.x;
    ey = hooked.y - hooked.size * 0.35;
  }

  if (mode === 'bite') {
    ex += Math.sin(time * 18) * 4;
    ey += Math.sin(time * 18) * 5;
  }

  ctx.strokeStyle = tension > 76 ? '#ffe2a0' : 'rgba(255,255,235,.95)';
  ctx.lineWidth = 1.5;

  ctx.beginPath();
  ctx.moveTo(sx, sy);
  ctx.quadraticCurveTo(
    (sx + ex) / 2 + Math.sin(time * 3) * 4,
    (sy + ey) / 2,
    ex,
    ey
  );
  ctx.stroke();

  if (mode !== 'fight') {
    // Visible lure and hook.
    ctx.fillStyle = '#ffdc54';
    ctx.beginPath();
    ctx.ellipse(ex, ey, 6, 4, Math.sin(time * 4) * 0.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#fff8d9';
    ctx.lineWidth = 1.7;
    ctx.beginPath();
    ctx.moveTo(ex + 2, ey + 2);
    ctx.lineTo(ex + 4, ey + 7);
    ctx.quadraticCurveTo(ex + 8, ey + 7, ex + 7, ey + 3);
    ctx.stroke();
  }

  if (mode === 'bite') {
    for (let i = 0; i < 3; i++) {
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.6 - i * 0.14) + ')';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(ex, ey, 12 + i * 8, 4 + i * 2, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
  }
}

function drawHookedFish() {
  if (!hooked) return;

  const f = hooked;
  const sp = f.species;
  const y = Math.max(H * 0.79, Math.min(H * 0.93, f.y));

  drawFish(ctx, f.x, y, f.size, {
    body: sp.body,
    back: sp.back,
    belly: sp.belly,
    spot: sp.spot
  }, 1);

  // Highlight around the fish being fought.
  ctx.strokeStyle = 'rgba(255,231,156,.9)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.ellipse(f.x, y + f.size * 0.08, f.size * 1.25, f.size * 0.58, 0, 0, Math.PI * 2);
  ctx.stroke();
}

function drawParticles(dt) {
  particles = particles.filter(p => p.life > 0);

  for (const p of particles) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 180 * dt;
    p.life -= dt;

    ctx.globalAlpha = Math.max(0, p.life / 0.8);
    ctx.fillStyle = '#e7ffff';
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.globalAlpha = 1;
}

function draw() {
  if (!W || !H) return;

  ctx.clearRect(0, 0, W, H);

  drawBackground();
  drawFishSchool();
  drawBoat();
  drawFishingLine();
  drawHookedFish();
}

function update(dt) {
  time += dt;

  for (const f of shoal) {
    f.x += f.speed * f.dir * dt;
    f.y += Math.sin(time * 1.4 + f.phase) * dt * 2;

    if (f.x < -60) f.x = W + 60;
    if (f.x > W + 60) f.x = -60;
  }

  if (mode === 'casting') {
    castProgress += dt * 1.2;

    const p = Math.min(1, castProgress);
    const startX = W * 0.5 + 55;
    const startY = H * 0.735 - 90;
    const targetX = W * 0.65;
    const targetY = H * 0.68;

    // Arcing line and lure travel.
    lure.x = startX + (targetX - startX) * p;
    lure.y = startY + (targetY - startY) * p - Math.sin(p * Math.PI) * H * 0.17;

    if (p >= 1) {
      lure.x = targetX;
      lure.y = targetY;
      splash(lure.x, lure.y, 16);
      beginWaiting();
    }
  } else if (mode === 'waiting') {
    waitTime -= dt;

    // Lure drifts gently with the water.
    lure.x += Math.sin(time * 1.3) * dt * 3;
    lure.y += Math.sin(time * 2.2) * dt * 1.5;

    if (waitTime <= 0) bite();
  } else if (mode === 'bite') {
    biteTime -= dt;
    lure.y += Math.sin(time * 18) * dt * 8;

    if (Math.random() < 0.09) {
      splash(lure.x, lure.y, 2);
    }

    if (biteTime <= 0) {
      mode = 'idle';
      setButtons();
      setStatus('The fish got away! Cast again and watch for the next bite.');
    }
  } else if (mode === 'fight' && hooked) {
    fightTime += dt;

    hooked.x = W * 0.5 +
      Math.sin(fightTime * 1.45 + hooked.phase) *
      Math.min(W * 0.29, 115) * distance;

    hooked.y = H * (0.83 + Math.sin(fightTime * 2.3 + hooked.phase) * 0.025);

    const pull = (Math.sin(fightTime * 1.8 + hooked.phase) + 1) / 2;
    tension = Math.max(5, Math.min(95, tension + dt * (pull > 0.83 ? 3 : -1)));

    // Prevent an unavoidable line snap.
    if (tension > 82) tension -= dt * 8;
  }

  for (const p of particles) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 180 * dt;
    p.life -= dt;
  }
}

function loop(now) {
  raf = requestAnimationFrame(loop);

  const dt = Math.min(0.04, Math.max(0, (now - last) / 1000 || 0));
  last = now;

  update(dt);
  draw();
}

renderAnglers();
updateStats();
resize();

window.addEventListener('resize', resize);

})();
</script>
